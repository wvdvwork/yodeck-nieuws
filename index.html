<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuws Dashboard</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:#0b1220;
color:white;
}

body{
background:linear-gradient(135deg,#0b1220,#020051);
}

/* TOPBAR */

#topbar{
position:absolute;
top:20px;
right:30px;
z-index:10;
}

#time{
font-size:32px;
font-weight:bold;
opacity:.9;
}

/* CARD */

#card{
position:absolute;
top:60px;
left:40px;
right:40px;
bottom:60px;

background:rgba(15,20,40,.96);
border-radius:18px;
border:1px solid rgba(255,255,255,.08);

padding:25px;
box-sizing:border-box;

display:flex;
flex-direction:column;
}

/* IMAGE (groter + iets smaller breedte effect) */

#newsImageContainer{
width:100%;
height:320px;
border-radius:14px;
overflow:hidden;
background:#111827;
margin-bottom:18px;
}

#newsImage{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

/* TITLE */

#title{
font-size:38px;
font-weight:700;
line-height:1.2;
margin-bottom:12px;
}

/* TEXT (MEER RUIMTE + GROTER) */

#desc{
font-size:26px;
line-height:1.5;
opacity:.95;
flex:1;
overflow:hidden;
}

/* SOURCE */

#source{
margin-top:12px;
font-size:18px;
opacity:.7;
}

/* TICKER */

#ticker{
position:absolute;
bottom:0;
left:0;
width:100%;
height:50px;
background:#020051;
display:flex;
align-items:center;
overflow:hidden;
}

#tickerText{
white-space:nowrap;
padding-left:100%;
animation:scroll 90s linear infinite;
font-size:18px;
}

@keyframes scroll{
0%{transform:translateX(0);}
100%{transform:translateX(-100%);}
}

</style>
</head>

<body>

<div id="topbar">
<div id="time"></div>
</div>

<div id="card">

<div id="newsImageContainer">
<img id="newsImage">
</div>

<div id="title">Nieuws laden...</div>
<div id="desc"></div>
<div id="source"></div>

</div>

<div id="ticker">
<div id="tickerText"></div>
</div>

<script>

const FEEDS = [
{
name:"NOS",
url:"https://feeds.nos.nl/nosnieuwsalgemeen"
},
{
name:"RTL Nieuws",
url:"https://www.rtlnieuws.nl/rss.xml"
}
];

let items = [];
let currentIndex = 0;

/* CLOCK */

function updateClock(){
const now = new Date();
document.getElementById("time").innerText =
now.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
}

updateClock();
setInterval(updateClock,60000);

/* IMAGE */

function getImage(item){
return item.enclosure?.link || item.thumbnail || "";
}

/* 🧠 EXTRA: FULL ARTICLE TEXT (belangrijk) */
async function getFullArticle(url){

try{

// simpele readable proxy (lichtgewicht)
const res = await fetch("https://r.jina.ai/http://" + url.replace("https://",""));
const text = await res.text();

return text
.replace(/[#*_]/g,'')
.replace(/\s+/g,' ')
.trim()
.substring(0,1200);

}catch(e){
return "";
}

}

/* LOAD RSS */

async function loadAll(){

let all = [];

for(const feed of FEEDS){

try{

const res = await fetch(
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(feed.url)
);

const data = await res.json();

if(data.items){

data.items.forEach(it=>{
it.sourceName = feed.name;
all.push(it);
});

}

}catch(e){}

}

items = all.sort(()=>Math.random()-0.5);

updateTicker();

if(currentIndex === 0){
showNews();
}

}

/* TICKER */

function updateTicker(){

document.getElementById("tickerText").innerText =
items.slice(0,15).map(i=>i.title).join("   •   ");

}

/* SHOW NEWS */

async function showNews(){

if(items.length === 0) return;

const item = items[currentIndex];

const img = document.getElementById("newsImage");
const image = getImage(item);

if(image){
img.src = image;
img.style.display = "block";
}else{
img.style.display = "none";
}

document.getElementById("title").innerText = item.title;

/* 👉 HIER: veel meer tekst dan RSS */
let fullText = item.description || "";

if(item.link){
fullText = await getFullArticle(item.link);
}

document.getElementById("desc").innerText =
fullText
.replace(/<[^>]+>/g,'')
.replace(/\s+/g,' ')
.trim()
.substring(0,1500);

document.getElementById("source").innerText =
"Bron: " + item.sourceName;

currentIndex++;

if(currentIndex >= items.length){
currentIndex = 0;
}

}

/* START */

loadAll();

setInterval(loadAll,900000);   // 15 min
setInterval(showNews,35000);   // iets rustiger voor Pi

</script>

</body>
</html>
