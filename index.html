<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height">
<title>Nieuws Dashboard</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
background:#0b0f1a;
color:white;
}

/* BACKGROUND */
#bg{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
filter:brightness(0.7);
transition:1s ease;
}

/* DARK OVERLAY */
#overlay{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.2));
}

/* TOP BAR */
#topbar{
position:absolute;
top:20px;
left:20px;
right:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

#logo{
height:55px;
}

#time{
font-size:28px;
opacity:0.8;
}

/* CARD */
#card{
position:absolute;
right:60px;
bottom:120px;
width:650px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:25px;
border-radius:16px;
border:1px solid rgba(255,255,255,0.1);
}

#title{
font-size:34px;
font-weight:bold;
margin-bottom:10px;
}

#desc{
font-size:20px;
opacity:0.9;
line-height:1.4;
}

/* SOURCE TAG */
#source{
margin-top:15px;
display:flex;
align-items:center;
gap:10px;
font-size:16px;
opacity:0.8;
}

.sourceLogo{
height:22px;
}

/* TICKER */
#ticker{
position:absolute;
bottom:0;
left:0;
width:100%;
height:45px;
background:#020051;
display:flex;
align-items:center;
overflow:hidden;
}

#tickerText{
white-space:nowrap;
padding-left:100%;
animation:scroll 40s linear infinite;
font-size:18px;
color:white;
}

@keyframes scroll{
0%{transform:translateX(0);}
100%{transform:translateX(-100%);}
}

</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="topbar">
<img id="logo" src="https://github.com/wvdvwork/yodeck-nieuws/blob/a49fe33504e2682e01a90fbc406b1a53245888b2/global-news-4305.svg">
<div id="time"></div>
</div>

<div id="card">
<div id="title">Laden...</div>
<div id="desc"></div>

<div id="source">
<img class="sourceLogo" id="sourceLogo">
<span id="sourceText"></span>
</div>

</div>

<div id="ticker">
<div id="tickerText"></div>
</div>

<script>

const FEEDS = [
{
name:"NOS",
logo:"https://upload.wikimedia.org/wikipedia/commons/b/b9/NOS_logo.svg",
url:"https://feeds.nos.nl/nosnieuwsalgemeen"
},
{
name:"RTL Nieuws",
logo:"https://upload.wikimedia.org/wikipedia/commons/a/a8/RTL_Nieuws_logo_2024.svg",
url:"https://www.rtlnieuws.nl/rss.xml"
}
];

let items = [];
let i = 0;

/* CLOCK */
function clock(){
const d = new Date();
document.getElementById("time").innerText =
d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
}
setInterval(clock,1000);
clock();

/* LOAD RSS */
async function loadAll(){

let all = [];

for(let f of FEEDS){
try{

let res = await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f.url));
let data = await res.json();

if(data.items){
data.items.forEach(it=>{
it.sourceName = f.name;
it.sourceLogo = f.logo;
});
all = all.concat(data.items);
}

}catch(e){}

}

/* shuffle */
items = all.sort(()=>Math.random()-0.5);

show();
setInterval(show,12000);

}

/* IMAGE FIX */
function getImage(item){
return item.enclosure?.link ||
item.thumbnail ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1920&q=80";
}

/* SHOW */
function show(){

const item = items[i];

document.getElementById("bg").style.backgroundImage =
`url(${getImage(item)})`;

document.getElementById("title").innerText = item.title;

document.getElementById("desc").innerHTML =
(item.description || "")
.replace(/<[^>]*>/g,"")
.substring(0,220);

/* SOURCE */
document.getElementById("sourceLogo").src = item.sourceLogo;
document.getElementById("sourceText").innerText = item.sourceName;

/* TICKER */
document.getElementById("tickerText").innerText =
items.slice(0,12).map(x=>x.title).join("   •   ");

i++;
if(i>=items.length) i=0;

}

loadAll();

</script>

</body>
</html>
