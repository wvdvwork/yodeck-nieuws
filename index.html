<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height">
<title>Nieuws Dashboard</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
background:#0b0f1a;
color:white;
}

/* BACKGROUND (NO ANIMATED SWITCHING FILTERS) */
#bg{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
transition:opacity 1s ease;
}

/* DARK OVERLAY */
#overlay{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.2));
}

/* TOP BAR */
#topbar{
position:absolute;
top:20px;
left:20px;
right:20px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:2;
}

#logo{
height:50px;
}

#time{
font-size:26px;
opacity:0.8;
}

/* CARD */
#card{
position:absolute;
right:60px;
bottom:120px;
width:620px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(8px);
padding:22px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.1);
z-index:2;
}

#title{
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

#desc{
font-size:18px;
opacity:0.9;
line-height:1.4;
}

/* SOURCE */
#source{
margin-top:12px;
display:flex;
align-items:center;
gap:10px;
font-size:15px;
opacity:0.8;
}

.sourceLogo{
height:20px;
}

/* TICKER */
#ticker{
position:absolute;
bottom:0;
left:0;
width:100%;
height:40px;
background:#020051;
display:flex;
align-items:center;
overflow:hidden;
}

#tickerText{
white-space:nowrap;
padding-left:100%;
animation:scroll 60s linear infinite;
font-size:16px;
}

@keyframes scroll{
0%{transform:translateX(0);}
100%{transform:translateX(-100%);}
}

</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="topbar">
<img id="logo" src="https://upload.wikimedia.org/wikipedia/commons/2/20/NOS_logo.svg">
<div id="time"></div>
</div>

<div id="card">
<div id="title">Laden...</div>
<div id="desc"></div>

<div id="source">
<img class="sourceLogo" id="sourceLogo">
<span id="sourceText"></span>
</div>

</div>

<div id="ticker">
<div id="tickerText"></div>
</div>

<script>

const FEEDS = [
{
name:"NOS",
logo:"https://upload.wikimedia.org/wikipedia/commons/b/b9/NOS_logo.svg",
url:"https://feeds.nos.nl/nosnieuwsalgemeen"
},
{
name:"RTL Nieuws",
logo:"https://upload.wikimedia.org/wikipedia/commons/a/a8/RTL_Nieuws_logo_2024.svg",
url:"https://www.rtlnieuws.nl/rss.xml"
}
];

let items = [];
let i = 0;

/* CLOCK */
function clock(){
const d = new Date();
document.getElementById("time").innerText =
d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
}
setInterval(clock,1000);
clock();

/* LOAD RSS ONCE */
async function loadAll(){

let all = [];

for(let f of FEEDS){

try{

let res = await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f.url));
let data = await res.json();

if(data.items){
data.items.forEach(it=>{
it.sourceName = f.name;
it.sourceLogo = f.logo;
all.push(it);
});
}

}catch(e){}

}

/* shuffle once */
items = all.sort(()=>Math.random()-0.5);

/* start loop */
show();
setInterval(show,15000); // minder refresh = smoother

}

/* SAFE IMAGE */
function getImage(item){
return item.enclosure?.link ||
item.thumbnail ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1920&q=80";
}

/* SHOW ITEM (NO HEAVY RELOADS) */
function show(){

const item = items[i];

const bg = document.getElementById("bg");

/* fade trick instead of hard switch */
bg.style.opacity = 0;

setTimeout(()=>{

bg.style.backgroundImage = `url(${getImage(item)})`;
bg.style.opacity = 1;

},500);

document.getElementById("title").innerText = item.title;

document.getElementById("desc").innerHTML =
(item.description || "")
.replace(/<[^>]*>/g,"")
.substring(0,200);

/* source */
document.getElementById("sourceLogo").src = item.sourceLogo;
document.getElementById("sourceText").innerText = item.sourceName;

/* ticker (only updates when needed) */
if(i === 0){
document.getElementById("tickerText").innerText =
items.slice(0,10).map(x=>x.title).join("   •   ");
}

i++;
if(i >= items.length) i = 0;

}

loadAll();

</script>

</body>
</html>
