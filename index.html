<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:#0b1220;
color:white;
}

#container{
display:grid;
grid-template-columns: 2fr 1fr;
grid-template-rows: 1fr 1fr;
height:100vh;
gap:20px;
padding:20px;
box-sizing:border-box;
}

/* NIEUWS */

#news{
grid-row:1 / span 2;
background:rgba(255,255,255,0.04);
border-radius:16px;
padding:20px;
overflow:hidden;
}

.newsItem{
margin-bottom:20px;
padding-bottom:15px;
border-bottom:1px solid rgba(255,255,255,0.08);
}

.newsTitle{
font-size:22px;
font-weight:bold;
margin-bottom:6px;
}

.newsDesc{
font-size:16px;
opacity:0.8;
line-height:1.4;
}

/* KLOK */

#clockBox{
display:flex;
justify-content:center;
align-items:center;
}

#clockCircle{
width:160px;
height:160px;
border-radius:50%;
border:4px solid rgba(255,255,255,0.2);
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
font-weight:bold;
background:rgba(255,255,255,0.05);
}

/* WEER */

#weather{
background:rgba(255,255,255,0.05);
border-radius:16px;
padding:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

#weatherTemp{
font-size:40px;
font-weight:bold;
}

#weatherDesc{
opacity:0.8;
margin-top:6px;
}

</style>
</head>

<body>

<div id="container">

<!-- NIEUWS -->
<div id="news">
<div class="newsItem">Laden...</div>
</div>

<!-- KLOK -->
<div id="clockBox">
<div id="clockCircle">--:--</div>
</div>

<!-- WEER -->
<div id="weather">
<div id="weatherTemp">--°C</div>
<div id="weatherDesc">Weer laden...</div>
</div>

</div>

<script>

/* CLOCK */
function updateClock(){
const now = new Date();
document.getElementById("clockCircle").innerText =
now.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
}

updateClock();
setInterval(updateClock,1000);

/* NEWS */

const FEEDS = [
{
name:"NOS",
url:"https://feeds.nos.nl/nosnieuwsalgemeen"
},
{
name:"RTL",
url:"https://www.rtlnieuws.nl/rss.xml"
}
];

let newsItems = [];

async function loadNews(){

let all = [];

for(const f of FEEDS){

try{

const res = await fetch(
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(f.url)
);

const data = await res.json();

if(data.items){

data.items.forEach(i=>{
i.sourceName = f.name;
all.push(i);
});

}

}catch(e){}

}

newsItems = all.slice(0,8);

renderNews();

}

function clean(text){
return (text || "")
.replace(/<[^>]*>/g,' ')
.replace(/\s+/g,' ')
.trim();
}

function renderNews(){

let html = "";

newsItems.forEach(n=>{

html += `
<div class="newsItem">
<div class="newsTitle">${n.title}</div>
<div class="newsDesc">${clean(n.description).substring(0,180)}</div>
</div>
`;

});

document.getElementById("news").innerHTML = html;

}

loadNews();
setInterval(loadNews,600000);

/* WEATHER GENEMUIDEN */

async function loadWeather(){

try{

const lat = 52.62;
const lon = 6.04;

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;

const res = await fetch(url);
const data = await res.json();

const w = data.current_weather;

document.getElementById("weatherTemp").innerText =
Math.round(w.temperature) + "°C";

document.getElementById("weatherDesc").innerText =
"Windsnelheid " + w.windspeed + " km/h";

}catch(e){

document.getElementById("weatherDesc").innerText =
"Geen weerdata";

}

}

loadWeather();
setInterval(loadWeather,600000);

</script>

</body>
</html>
