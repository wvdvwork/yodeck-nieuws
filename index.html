<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
color:white;

/* 🌌 ZACHT DONKERBLAUW */
background: linear-gradient(135deg, #0a1a33, #0d2b52, #123a66);
background-size: 300% 300%;
animation: bgMove 25s ease infinite;
}

@keyframes bgMove {
0% {background-position:0% 50%;}
50% {background-position:100% 50%;}
100% {background-position:0% 50%;}
}

/* GRID */
#container{
display:grid;
grid-template-columns: 2.2fr 1fr;
grid-template-rows: 1fr 1fr;
height:100vh;
width:100vw;
gap:20px;
padding:20px;
box-sizing:border-box;
}

/* GLASS */
#news, #weather, #clockCircle{
background: rgba(255,255,255,0.08);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,0.12);
border-radius:16px;
}

/* 📰 NIEUWS */
#news{
grid-row:1 / span 2;
padding:20px;
overflow:hidden;
display:flex;
flex-direction:column;
gap:12px;
}

/* 📱 RESPONSIVE NEWS ITEMS */
.newsItem{
display:flex;
gap:12px;
padding:12px;
border-bottom:1px solid rgba(255,255,255,0.08);
transition:0.2s;
align-items:center;
}

.newsItem:hover{
background: rgba(255,255,255,0.06);
border-radius:12px;
}

/* afbeelding schaalbaar */
.newsImg{
width:clamp(60px, 8vw, 100px);
height:clamp(45px, 6vw, 75px);
border-radius:10px;
object-fit:cover;
flex-shrink:0;
}

/* tekst schaalbaar */
.newsTitle{
font-size:clamp(14px, 1.2vw, 18px);
font-weight:bold;
margin-bottom:4px;
line-height:1.2;
}

.newsDesc{
font-size:clamp(12px, 1vw, 14px);
opacity:0.85;
line-height:1.3;
}

/* KLOK */
#clockBox{
display:flex;
justify-content:center;
align-items:center;
}

#clockCircle{
width:180px;
height:180px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

#clockTime{
font-size:clamp(28px, 3vw, 38px);
font-weight:bold;
}

#clockDate{
font-size:14px;
opacity:0.85;
margin-top:4px;
}

/* WEER */
#weather{
padding:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:6px;
}

#weatherIcon{
font-size:48px;
}

#weatherTemp{
font-size:clamp(26px, 2.5vw, 34px);
font-weight:bold;
}

#weatherDesc{
opacity:0.85;
font-size:clamp(12px, 1vw, 14px);
}

</style>
</head>

<body>

<div id="container">

<!-- NIEUWS -->
<div id="news">
<div class="newsItem">Laden...</div>
</div>

<!-- KLOK -->
<div id="clockBox">
<div id="clockCircle">
<div id="clockTime">--:--</div>
<div id="clockDate">--</div>
</div>
</div>

<!-- WEER -->
<div id="weather">
<div id="weatherIcon">🌤</div>
<div id="weatherTemp">--°C</div>
<div id="weatherDesc">Weer laden...</div>
</div>

</div>

<script>

/* CLOCK */
function updateClock(){
const now = new Date();
const days = ["Zo","Ma","Di","Wo","Do","Vr","Za"];

document.getElementById("clockTime").innerText =
now.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});

document.getElementById("clockDate").innerText =
days[now.getDay()] + " " + now.getDate() + "-" + (now.getMonth()+1);
}

updateClock();
setInterval(updateClock,1000);

/* NEWS */
const FEEDS = [
{ name:"NOS", url:"https://feeds.nos.nl/nosnieuwsalgemeen" },
{ name:"RTL", url:"https://www.rtlnieuws.nl/rss.xml" }
];

let newsItems = [];

function clean(text){
return (text || "")
.replace(/<[^>]*>/g,' ')
.replace(/\s+/g,' ')
.trim();
}

function getImage(item){
return item.enclosure?.link || item.thumbnail || "";
}

async function loadNews(){

let all = [];

for(const f of FEEDS){
try{
const res = await fetch(
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(f.url)
);

const data = await res.json();

if(data.items){
data.items.forEach(i=>{
i.sourceName = f.name;
all.push(i);
});
}

}catch(e){}
}

newsItems = all.slice(0,8);
renderNews();
}

function renderNews(){

let html = "";

newsItems.forEach(n=>{
html += `
<div class="newsItem">
<img class="newsImg" src="${getImage(n)}" onerror="this.style.display='none'">
<div class="newsContent">
<div class="newsTitle">${n.title}</div>
<div class="newsDesc">${clean(n.description).substring(0,120)}</div>
</div>
</div>
`;
});

document.getElementById("news").innerHTML = html;
}

loadNews();
setInterval(loadNews,600000);

/* WEATHER */
async function loadWeather(){

try{

const lat = 52.06;
const lon = 4.58;

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;

const res = await fetch(url);
const data = await res.json();

const w = data.current_weather;

document.getElementById("weatherTemp").innerText =
Math.round(w.temperature) + "°C";

document.getElementById("weatherDesc").innerText =
"Winds: " + w.windspeed + " km/h";

let icon = "🌤";
if(w.windspeed > 40) icon = "🌬";
if(w.temperature < 5) icon = "❄️";
if(w.weathercode >= 61) icon = "🌧";

document.getElementById("weatherIcon").innerText = icon;

}catch(e){
document.getElementById("weatherDesc").innerText =
"Geen weerdata";
}
}

loadWeather();
setInterval(loadWeather,600000);

</script>

</body>
</html>
