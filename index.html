<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height">
<title>Multi News PRO</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
background:#111;
}

/* BACKGROUND */
#bg{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
filter:contrast(1.05) saturate(1.1);
transition:1s ease;
}

/* OVERLAY */
#overlay{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.15));
}

/* LOGO */
#logo{
position:absolute;
top:25px;
left:25px;
width:120px;
height:auto;
}

/* CARD */
#card{
position:absolute;
right:50px;
bottom:90px;
width:650px;
background:white;
padding:30px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

#title{
font-size:34px;
font-weight:bold;
margin-bottom:15px;
}

#desc{
font-size:22px;
color:#333;
line-height:1.4;
}

/* TICKER */
#ticker{
position:absolute;
bottom:0;
left:0;
width:100%;
height:45px;
background:#020051;
color:white;
display:flex;
align-items:center;
overflow:hidden;
}

#tickerText{
white-space:nowrap;
display:inline-block;
padding-left:100%;
animation:scroll 45s linear infinite;
font-size:20px;
}

@keyframes scroll{
0% { transform: translateX(0); }
100% { transform: translateX(-100%); }
}

/* VIDEO */
#video{
position:absolute;
width:100%;
height:100%;
display:none;
border:none;
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<img id="logo" src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Nu-nl-logo.png">

<iframe id="video"></iframe>

<div id="card">
<div id="title">Laden...</div>
<div id="desc"></div>
</div>

<div id="ticker">
<div id="tickerText"></div>
</div>

<script>

const FEEDS = [
"https://www.nu.nl/rss",
"https://feeds.nos.nl/nosnieuwsalgemeen",
"https://feeds.bbci.co.uk/news/rss.xml",
"https://www.rtlnieuws.nl/rss.xml"
];

let items = [];
let i = 0;

/* LOAD MULTI RSS */
async function loadAll(){

let all = [];

for(let url of FEEDS){
try{
let res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url));
let data = await res.json();

if(data.items){
all = all.concat(data.items);
}
}catch(e){}
}

/* shuffle + mix */
items = all.sort(() => Math.random() - 0.5);

show();
setInterval(show,12000);
}

/* BEST IMAGE PICKER */
function getImage(item){

return item.enclosure?.link ||
item.thumbnail ||
"https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1920&q=80";
}

/* VIDEO DETECT */
function getVideo(url){
if(!url) return null;

let m =
url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/) ||
url.match(/v=([a-zA-Z0-9_-]+)/);

return m ? m[1] : null;
}

/* SHOW */
function show(){

const item = items[i];

const video = document.getElementById("video");
video.style.display = "none";
video.src = "";

/* IMAGE */
let img = getImage(item);

document.getElementById("bg").style.backgroundImage =
`url(${img})`;

/* TEXT */
document.getElementById("title").innerText = item.title;

document.getElementById("desc").innerHTML =
(item.description || "")
.replace(/<[^>]*>/g,"")
.substring(0,200);

/* TICKER */
document.getElementById("tickerText").innerText =
items.slice(0,15).map(x => x.title).join("   •   ");

/* VIDEO */
let vid = getVideo(item.link);

if(vid){
video.src = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=0&loop=1`;
video.style.display = "block";
document.getElementById("bg").style.backgroundImage = "none";
}

i++;
if(i >= items.length) i = 0;
}

loadAll();

</script>

</body>
</html>
