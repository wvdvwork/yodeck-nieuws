<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height">
<title>NU Nieuws Display</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
background:#111;
}

/* ACHTERGROND */
#bg{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
transition:opacity 1s ease;
}

/* OVERLAY */
#overlay{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.1));
}

/* NU LOGO */
#logo{
position:absolute;
top:25px;
left:25px;
width:120px;
height:auto;
}

/* TEKST CARD */
#card{
position:absolute;
right:50px;
bottom:90px;
width:650px;
background:white;
padding:30px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

#title{
font-size:34px;
font-weight:bold;
margin-bottom:15px;
}

#desc{
font-size:22px;
color:#333;
line-height:1.4;
}

/* BLAUWE BALK */
#ticker{
position:absolute;
bottom:0;
left:0;
width:100%;
background:#0b3dd9;
color:white;
padding:12px;
font-size:20px;
white-space:nowrap;
overflow:hidden;
}

/* VIDEO */
#video{
position:absolute;
width:100%;
height:100%;
display:none;
border:none;
}
</style>
</head>

<body>

<!-- ACHTERGROND -->
<div id="bg"></div>
<div id="overlay"></div>

<!-- NU LOGO -->
<img id="logo" src="https://upload.wikimedia.org/wikipedia/commons/d/d9/Nu-nl-logo.png">

<!-- VIDEO -->
<iframe id="video"></iframe>

<!-- TEKST -->
<div id="card">
<div id="title">Laden...</div>
<div id="desc"></div>
</div>

<!-- TICKER -->
<div id="ticker">Nieuws wordt geladen...</div>

<script>

const RSS = "https://www.nu.nl/rss";

let items = [];
let i = 0;

/* RSS LOAD */
async function load(){
const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS));
const data = await res.json();

items = data.items || [];

show();
setInterval(show,12000);
}

/* IMAGE SELECTOR (stabiel) */
function getImage(item){
return item.enclosure?.link ||
       item.thumbnail ||
       "https://picsum.photos/1920/1080?random=" + Math.random();
}

/* YOUTUBE DETECT */
function getYouTubeId(url){
if(!url) return null;

let m =
url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/) ||
url.match(/v=([a-zA-Z0-9_-]+)/);

return m ? m[1] : null;
}

/* SHOW SLIDE */
function show(){

const item = items[i];

/* reset video */
const video = document.getElementById("video");
video.style.display = "none";
video.src = "";

/* IMAGE */
let img = getImage(item);

document.getElementById("bg").style.backgroundImage =
`url(${img})`;

/* TEXT */
document.getElementById("title").innerText = item.title;

document.getElementById("desc").innerHTML =
(item.description || "")
.replace(/<[^>]*>/g,"")
.substring(0,200);

/* TICKER */
document.getElementById("ticker").innerText =
items.slice(0,7).map(x => x.title).join(" • ");

/* VIDEO MODE */
let vid = getYouTubeId(item.link);

if(vid){
video.src = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=0&loop=1`;
video.style.display = "block";
document.getElementById("bg").style.backgroundImage = "none";
}

i++;
if(i >= items.length) i = 0;
}

load();

</script>

</body>
</html>
