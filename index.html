<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height">
<title>Nieuws scherm</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial, Helvetica, sans-serif;
background:black;
}

#bg{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
transition:opacity 1s ease;
}

#overlay{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.1));
}

#logo{
position:absolute;
top:30px;
left:30px;
width:90px;
height:90px;
background:#0b3dd9;
color:white;
font-size:40px;
font-weight:bold;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
}

#card{
position:absolute;
right:50px;
bottom:80px;
width:650px;
background:white;
padding:30px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

#title{
font-size:34px;
font-weight:bold;
margin-bottom:15px;
}

#desc{
font-size:22px;
color:#333;
line-height:1.4;
}

#clock{
position:absolute;
top:40px;
right:50px;
color:white;
font-size:28px;
}

#ticker{
position:absolute;
bottom:0;
left:0;
width:100%;
background:#0b3dd9;
color:white;
padding:10px;
font-size:18px;
white-space:nowrap;
overflow:hidden;
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="logo">NU</div>
<div id="clock"></div>

<div id="card">
<div id="title">Laden...</div>
<div id="desc"></div>
</div>

<div id="ticker">Nieuws wordt geladen...</div>

<script>

const RSS = "https://www.nu.nl/rss";

let items = [];
let i = 0;

// klok
setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
},1000);

// RSS laden via publieke JSON proxy
async function load(){
const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS));
const data = await res.json();

items = data.items || [];

start();
}

function start(){
show();
setInterval(show,12000);
}

function show(){

const item = items[i];

// afbeelding
let img = item.thumbnail || "";

if(img){
document.getElementById("bg").style.backgroundImage = `url(${img})`;
}

// tekst
document.getElementById("title").innerText = item.title || "";
document.getElementById("desc").innerHTML =
(item.description || "").replace(/<[^>]*>/g,"").substring(0,200);

// ticker
document.getElementById("ticker").innerText =
items.slice(0,5).map(x => x.title).join(" • ");

i++;
if(i >= items.length) i = 0;
}

load();

</script>

</body>
</html>
