<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height">

<title>NU Nieuws OG</title>

<style>
html,body{
margin:0;
height:100%;
width:100%;
overflow:hidden;
font-family:Arial;
background:black;
}

#bg{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
transition:opacity 1s ease;
}

#overlay{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.1));
}

#logo{
position:absolute;
top:30px;
left:30px;
width:90px;
height:90px;
border-radius:50%;
background:#0b3dd9;
color:white;
font-size:40px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
}

#card{
position:absolute;
right:50px;
bottom:80px;
width:650px;
background:white;
padding:30px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

#title{
font-size:34px;
font-weight:bold;
margin-bottom:15px;
}

#desc{
font-size:22px;
color:#333;
}

#ticker{
position:absolute;
bottom:0;
left:0;
width:100%;
background:#0b3dd9;
color:white;
padding:10px;
font-size:18px;
white-space:nowrap;
overflow:hidden;
}

#clock{
position:absolute;
top:40px;
right:50px;
color:white;
font-size:28px;
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="logo">NU</div>
<div id="clock"></div>

<div id="card">
<div id="title">Laden...</div>
<div id="desc"></div>
</div>

<div id="ticker"></div>

<script>

const RSS = "https://www.nu.nl/rss";

let items = [];
let i = 0;

// klok
setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
},1000);

// RSS via proxy
async function load(){
const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS));
const data = await res.json();

items = data.items || [];

show();
setInterval(show,12000);
}

// OG IMAGE SCRAPER
async function getOGImage(url){

try{
const res = await fetch(url);
const html = await res.text();

let match = html.match(/property="og:image"\scontent="(.*?)"/i);

if(match && match[1]){
return match[1];
}

}catch(e){}

return "https://picsum.photos/1920/1080?random=" + Math.random();
}

async function show(){

const item = items[i];

// titel + tekst
document.getElementById("title").innerText = item.title;

document.getElementById("desc").innerHTML =
(item.description || "").replace(/<[^>]*>/g,"").substring(0,200);

// ticker
document.getElementById("ticker").innerText =
items.slice(0,5).map(x => x.title).join(" • ");

// IMAGE = OG IMAGE (belangrijk deel)
let img = await getOGImage(item.link);

document.getElementById("bg").style.backgroundImage =
`url(${img})`;

i++;
if(i >= items.length) i = 0;
}

load();

</script>

</body>
</html>
