<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
color:white;

/* VROLIJKE ACHTERGROND */
background: linear-gradient(135deg, #4facfe, #00f2fe, #a18cd1);
background-size: 400% 400%;
animation: bgMove 15s ease infinite;
}

@keyframes bgMove {
0% {background-position:0% 50%;}
50% {background-position:100% 50%;}
100% {background-position:0% 50%;}
}

/* GRID */
#container{
display:grid;
grid-template-columns: 2.2fr 1fr;
grid-template-rows: 1fr 1fr;
height:100vh;
gap:20px;
padding:20px;
box-sizing:border-box;
}

/* GLASS EFFECT BASE */
#news, #weather, #clockCircle{
background: rgba(255,255,255,0.12);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255,255,255,0.18);
box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

/* NIEUWS */
#news{
grid-row:1 / span 2;
border-radius:16px;
padding:20px;
overflow:hidden;
}

.newsItem{
display:flex;
gap:12px;
margin-bottom:18px;
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.1);
transition: transform 0.2s ease, background 0.2s ease;
border-radius:12px;
}

.newsItem:hover{
transform: scale(1.02);
background: rgba(255,255,255,0.08);
}

.newsImg{
width:90px;
height:65px;
border-radius:10px;
object-fit:cover;
background:#111;
}

.newsContent{
flex:1;
}

.newsTitle{
font-size:18px;
font-weight:bold;
margin-bottom:4px;
}

.newsDesc{
font-size:14px;
opacity:0.85;
line-height:1.3;
}

/* KLOK */
#clockBox{
display:flex;
justify-content:center;
align-items:center;
}

#clockCircle{
width:180px;
height:180px;
border-radius:50%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
animation: float 4s ease-in-out infinite;
}

@keyframes float {
0%,100% {transform: translateY(0);}
50% {transform: translateY(-6px);}
}

#clockTime{
font-size:36px;
font-weight:bold;
letter-spacing:1px;
text-shadow: 0 2px 10px rgba(0,0,0,0.25);
}

#clockDate{
font-size:14px;
opacity:0.85;
margin-top:4px;
}

/* WEER */
#weather{
border-radius:16px;
padding:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:6px;
}

#weatherIcon{
font-size:48px;
animation: pop 2s infinite alternate;
}

@keyframes pop {
from {transform: scale(1);}
to {transform: scale(1.12);}
}

#weatherTemp{
font-size:34px;
font-weight:bold;
}

#weatherDesc{
opacity:0.85;
}

</style>
</head>

<body>

<div id="container">

<!-- NIEUWS -->
<div id="news">
<div class="newsItem">Laden...</div>
</div>

<!-- KLOK -->
<div id="clockBox">
<div id="clockCircle">
<div id="clockTime">--:--</div>
<div id="clockDate">--</div>
</div>
</div>

<!-- WEER -->
<div id="weather">
<div id="weatherIcon">🌤</div>
<div id="weatherTemp">--°C</div>
<div id="weatherDesc">Weer laden...</div>
</div>

</div>

<script>

/* CLOCK */
function updateClock(){
const now = new Date();
const days = ["Zo","Ma","Di","Wo","Do","Vr","Za"];

document.getElementById("clockTime").innerText =
now.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});

document.getElementById("clockDate").innerText =
days[now.getDay()] + " " + now.getDate() + "-" + (now.getMonth()+1);
}

updateClock();
setInterval(updateClock,1000);

/* NEWS */
const FEEDS = [
{ name:"NOS", url:"https://feeds.nos.nl/nosnieuwsalgemeen" },
{ name:"RTL", url:"https://www.rtlnieuws.nl/rss.xml" }
];

let newsItems = [];

function getImage(item){
return item.enclosure?.link || item.thumbnail || "";
}

async function loadNews(){

let all = [];

for(const f of FEEDS){
try{
const res = await fetch(
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(f.url)
);

const data = await res.json();

if(data.items){
data.items.forEach(i=>{
i.sourceName = f.name;
all.push(i);
});
}

}catch(e){}
}

newsItems = all.slice(0,8);
renderNews();
}

function clean(text){
return (text || "")
.replace(/<[^>]*>/g,' ')
.replace(/\s+/g,' ')
.trim();
}

function renderNews(){

let html = "";

newsItems.forEach(n=>{
html += `
<div class="newsItem">
<img class="newsImg" src="${getImage(n)}" onerror="this.style.display='none'">
<div class="newsContent">
<div class="newsTitle">${n.title}</div>
<div class="newsDesc">${clean(n.description).substring(0,120)}</div>
</div>
</div>
`;
});

document.getElementById("news").innerHTML = html;
}

loadNews();
setInterval(loadNews,600000);

/* WEATHER */
async function loadWeather(){

try{

const lat = 52.06;
const lon = 4.58;

const url =
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;

const res = await fetch(url);
const data = await res.json();

const w = data.current_weather;

document.getElementById("weatherTemp").innerText =
Math.round(w.temperature) + "°C";

document.getElementById("weatherDesc").innerText =
"Windsnelheid " + w.windspeed + " km/h";

/* icon */
let icon = "🌤";
if(w.windspeed > 40) icon = "🌬";
if(w.temperature < 5) icon = "❄️";
if(w.weathercode >= 61) icon = "🌧";

document.getElementById("weatherIcon").innerText = icon;

}catch(e){
document.getElementById("weatherDesc").innerText =
"Geen weerdata";
}
}

loadWeather();
setInterval(loadWeather,600000);

</script>

</body>
</html>
