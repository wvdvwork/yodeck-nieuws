<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height">
<title>NU Nieuws PRO</title>

<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial;
background:#000;
}

#bg{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
transition:opacity 1s ease;
}

#overlay{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.1));
}

/* NU LOGO */
#logo{
position:absolute;
top:25px;
right:25px;
width:80px;
height:80px;
background:#0b3dd9;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:36px;
font-weight:bold;
}

/* TEKST KAART */
#card{
position:absolute;
right:50px;
bottom:90px;
width:650px;
background:white;
padding:30px;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

#title{
font-size:34px;
font-weight:bold;
margin-bottom:15px;
}

#desc{
font-size:22px;
color:#333;
}

/* BLAUWE NU BALK */
#ticker{
position:absolute;
bottom:0;
left:0;
width:100%;
background:#0b3dd9;
color:white;
padding:12px;
font-size:20px;
white-space:nowrap;
overflow:hidden;
}

/* VIDEO */
#video{
position:absolute;
width:100%;
height:100%;
display:none;
border:none;
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="logo">NU</div>

<iframe id="video"></iframe>

<div id="card">
<div id="title">Laden...</div>
<div id="desc"></div>
</div>

<div id="ticker"></div>

<script>

const RSS = "https://www.nu.nl/rss";

let items = [];
let i = 0;

/* RSS LOADER */
async function load(){
const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS));
const data = await res.json();

items = data.items || [];
show();
setInterval(show,12000);
}

/* VIDEO DETECT (YouTube) */
function getYouTubeId(url){
if(!url) return null;
let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/) ||
        url.match(/v=([a-zA-Z0-9_-]+)/);
return m ? m[1] : null;
}

function show(){

const item = items[i];

/* reset video */
const video = document.getElementById("video");
video.style.display = "none";
video.src = "";

/* IMAGE (OG fallback via thumbnail API-safe) */
let img =
item.thumbnail ||
"https://picsum.photos/1920/1080?random=" + i;

document.getElementById("bg").style.backgroundImage =
`url(${img})`;

/* TEXT */
document.getElementById("title").innerText = item.title;
document.getElementById("desc").innerHTML =
(item.description || "").replace(/<[^>]*>/g,"").substring(0,180);

/* TICKER */
document.getElementById("ticker").innerText =
items.slice(0,6).map(x => x.title).join(" • ");

/* VIDEO MODE */
let vid = getYouTubeId(item.link);

if(vid){
video.src = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=0&loop=1`;
video.style.display = "block";
document.getElementById("bg").style.backgroundImage = "none";
}

i++;
if(i >= items.length) i = 0;
}

load();

</script>

</body>
</html>
