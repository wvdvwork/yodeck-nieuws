<html lang="nl">
<head>
<meta charset="utf-8">

<style>
html,body{
margin:0;

<body>

<div id="bg"></div>
<div id="overlay"></div>

<div id="topbar">
<div id="time"></div>
</div>

<div id="card">
<div id="title">Nieuws laden...</div>

<div id="desc"></div>

<div id="source"></div>
</div>

<div id="ticker">
<div id="tickerText"></div>
</div>

<script>

const FEEDS = [
{
name:"NOS",
url:"https://feeds.nos.nl/nosnieuwsalgemeen"
},
{
name:"RTL Nieuws",
url:"https://www.rtlnieuws.nl/rss.xml"
}
];

let items = [];
let currentIndex = 0;

/* KLOK */
function updateClock(){

const now = new Date();

document.getElementById("time").innerText =
now.toLocaleTimeString(
'nl-NL',
{
hour:'2-digit',
minute:'2-digit'
}
);

}

updateClock();
setInterval(updateClock,60000);

/* RSS LADEN */
async function loadAll(){

let allItems = [];

for(const feed of FEEDS){

try{

const response =
await fetch(
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(feed.url)
);

const data = await response.json();

if(data.items){

data.items.forEach(item => {

item.sourceName = feed.name;

allItems.push(item);

});

}

}catch(error){

console.log("Feed fout:",feed.name);

}

}

items = allItems.sort(
() => Math.random() - 0.5
);

updateTicker();

if(currentIndex === 0){
showNews();
}

}

/* TICKER */
function updateTicker(){

document.getElementById("tickerText").innerText =
items
.slice(0,15)
.map(item => item.title)
.join("   •   ");

}

/* NIEUWS TONEN */
function showNews(){

if(items.length === 0) return;

const item = items[currentIndex];

document.getElementById("title").innerText =
item.title;

document.getElementById("desc").innerText =
(item.description || "")
.replace(/<[^>]+>/g,'')
.substring(0,250);

document.getElementById("source").innerText =
"Bron: " + item.sourceName;

currentIndex++;

if(currentIndex >= items.length){
currentIndex = 0;
}

}

/* START */
loadAll();

setInterval(loadAll,900000);   // 15 min
setInterval(showNews,30000);   // 30 sec

</script>

</body>
</html>
