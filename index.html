```html
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height">
<title>Nieuws Dashboard</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:#0b1220;
color:white;
}

body{
background:linear-gradient(135deg,#0b1220,#020051);
}

/* TOPBAR */

#topbar{
position:absolute;
top:25px;
right:35px;
z-index:10;
}

#time{
font-size:32px;
font-weight:bold;
opacity:0.9;
}

/* CARD */

#card{
position:absolute;
top:80px;
left:60px;
right:60px;
bottom:70px;

background:rgba(15,20,40,0.95);

border:1px solid rgba(255,255,255,0.08);
border-radius:18px;

padding:30px;

display:flex;
flex-direction:column;

box-sizing:border-box;
}

/* IMAGE */

#newsImageContainer{
width:100%;
height:320px;
overflow:hidden;
border-radius:14px;
background:#111827;
margin-bottom:25px;
}

#newsImage{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

/* TITLE */

#title{
font-size:42px;
font-weight:700;
line-height:1.2;
margin-bottom:18px;
}

/* DESCRIPTION */

#desc{
font-size:22px;
line-height:1.5;
opacity:0.92;
flex:1;
}

/* SOURCE */

#source{
margin-top:20px;
font-size:18px;
opacity:0.7;
}

/* TICKER */

#ticker{
position:absolute;
left:0;
bottom:0;
width:100%;
height:50px;

background:#020051;

display:flex;
align-items:center;

overflow:hidden;
}

#tickerText{
white-space:nowrap;
padding-left:100%;
animation:scroll 90s linear infinite;
font-size:18px;
}

@keyframes scroll{
0%{
transform:translateX(0);
}
100%{
transform:translateX(-100%);
}
}

</style>
</head>

<body>

<div id="topbar">
<div id="time"></div>
</div>

<div id="card">

<div id="newsImageContainer">
<img id="newsImage" src="" alt="">
</div>

<div id="title">Nieuws laden...</div>

<div id="desc"></div>

<div id="source"></div>

</div>

<div id="ticker">
<div id="tickerText"></div>
</div>

<script>

const FEEDS = [

{
name:"NOS",
url:"https://feeds.nos.nl/nosnieuwsalgemeen"
},

{
name:"RTL Nieuws",
url:"https://www.rtlnieuws.nl/rss.xml"
}

];

let items = [];
let currentIndex = 0;

/* CLOCK */

function updateClock(){

const now = new Date();

document.getElementById("time").innerText =
now.toLocaleTimeString(
'nl-NL',
{
hour:'2-digit',
minute:'2-digit'
}
);

}

updateClock();
setInterval(updateClock,60000);

/* IMAGE */

function getImage(item){

return (
item.enclosure?.link ||
item.thumbnail ||
""
);

}

/* RSS */

async function loadAll(){

let allItems = [];

for(const feed of FEEDS){

try{

const response =
await fetch(
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(feed.url)
);

const data = await response.json();

if(data.items){

data.items.forEach(item => {

item.sourceName = feed.name;

allItems.push(item);

});

}

}catch(error){

console.log("Feed fout:",feed.name);

}

}

items = allItems.sort(() => Math.random() - 0.5);

updateTicker();

if(currentIndex === 0){
showNews();
}

}

/* TICKER */

function updateTicker(){

document.getElementById("tickerText").innerText =
items
.slice(0,15)
.map(item => item.title)
.join("   •   ");

}

/* SHOW NEWS */

function showNews(){

if(items.length === 0) return;

const item = items[currentIndex];

const image = getImage(item);

const img =
document.getElementById("newsImage");

if(image){

img.src = image;
img.style.display = "block";

}else{

img.style.display = "none";

}

document.getElementById("title").innerText =
item.title;

document.getElementById("desc").innerText =
(item.description || "")
.replace(/<[^>]+>/g,'')
.substring(0,300);

document.getElementById("source").innerText =
"Bron: " + item.sourceName;

currentIndex++;

if(currentIndex >= items.length){
currentIndex = 0;
}

}

/* START */

loadAll();

setInterval(loadAll,900000);   // 15 minuten RSS refresh
setInterval(showNews,30000);   // 30 seconden per bericht

</script>

</body>
</html>
```
