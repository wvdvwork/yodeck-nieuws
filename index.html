<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuws Dashboard</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:#0b1220;
color:#fff;
}

body{
background:linear-gradient(135deg,#0b1220,#020051);
}

/* KLOK */

#topbar{
position:absolute;
top:20px;
right:35px;
z-index:100;
}

#time{
font-size:32px;
font-weight:bold;
opacity:.9;
}

/* HOOFDCARD */

#card{
position:absolute;
top:70px;
left:40px;
right:40px;
bottom:70px;

background:rgba(15,20,40,.96);

border-radius:18px;
border:1px solid rgba(255,255,255,.08);

padding:25px;
box-sizing:border-box;

display:flex;
flex-direction:column;
}

/* FOTO */

#newsImageContainer{
height:220px;
border-radius:14px;
overflow:hidden;
background:#111827;
margin-bottom:20px;
}

#newsImage{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

/* TITEL */

#title{
font-size:40px;
font-weight:700;
line-height:1.2;
margin-bottom:15px;
}

/* BESCHRIJVING */

#desc{
font-size:24px;
line-height:1.45;
opacity:.95;
overflow:hidden;
flex:1;
}

/* BRON */

#source{
margin-top:15px;
font-size:18px;
opacity:.7;
}

/* TICKER */

#ticker{
position:absolute;
bottom:0;
left:0;
width:100%;
height:50px;
background:#020051;
display:flex;
align-items:center;
overflow:hidden;
}

#tickerText{
white-space:nowrap;
padding-left:100%;
animation:scroll 90s linear infinite;
font-size:18px;
}

@keyframes scroll{
0%{
transform:translateX(0);
}
100%{
transform:translateX(-100%);
}
}

</style>
</head>

<body>

<div id="topbar">
<div id="time"></div>
</div>

<div id="card">

<div id="newsImageContainer">
<img id="newsImage">
</div>

<div id="title">Nieuws laden...</div>

<div id="desc"></div>

<div id="source"></div>

</div>

<div id="ticker">
<div id="tickerText"></div>
</div>

<script>

const FEEDS = [
{
name:"NOS",
url:"https://feeds.nos.nl/nosnieuwsalgemeen"
},
{
name:"RTL Nieuws",
url:"https://www.rtlnieuws.nl/rss.xml"
}
];

let items = [];
let currentIndex = 0;

/* KLOK */

function updateClock(){

const now = new Date();

document.getElementById("time").innerText =
now.toLocaleTimeString(
'nl-NL',
{
hour:'2-digit',
minute:'2-digit'
}
);

}

updateClock();
setInterval(updateClock,60000);

/* FOTO */

function getImage(item){

if(item.enclosure && item.enclosure.link){
return item.enclosure.link;
}

if(item.thumbnail){
return item.thumbnail;
}

return "";

}

/* RSS LADEN */

async function loadAll(){

let allItems = [];

for(const feed of FEEDS){

try{

const response = await fetch(
"https://api.rss2json.com/v1/api.json?rss_url=" +
encodeURIComponent(feed.url)
);

const data = await response.json();

if(data.items){

data.items.forEach(item=>{

item.sourceName = feed.name;
allItems.push(item);

});

}

}catch(e){

console.log("Feed fout:",feed.name);

}

}

items = allItems.sort(() => Math.random() - 0.5);

updateTicker();

if(currentIndex === 0){
showNews();
}

}

/* TICKER */

function updateTicker(){

document.getElementById("tickerText").innerText =
items
.slice(0,15)
.map(item => item.title)
.join("   •   ");

}

/* NIEUWS TONEN */

function showNews(){

if(items.length === 0){
return;
}

const item = items[currentIndex];

const img = document.getElementById("newsImage");
const image = getImage(item);

if(image){

img.src = image;
img.style.display = "block";

}else{

img.style.display = "none";

}

document.getElementById("title").innerText =
item.title;

document.getElementById("desc").innerText =
(item.description || "")
.replace(/<[^>]+>/g,'')
.replace(/\s+/g,' ')
.trim();

document.getElementById("source").innerText =
"Bron: " + item.sourceName;

currentIndex++;

if(currentIndex >= items.length){
currentIndex = 0;
}

}

/* START */

loadAll();

setInterval(loadAll,900000);
setInterval(showNews,30000);

</script>

</body>
</html>
