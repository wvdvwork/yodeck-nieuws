<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>NL Verkeer Dashboard</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css"/>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
  width:100%;
  overflow:hidden;
  font-family: Arial, sans-serif;
}

#container {
  display:flex;
  height:100%;
  width:100%;
}

/* LINKS */
#sidebar {
  width:30%;
  background:#111;
  color:#fff;
  padding:15px;
  box-sizing:border-box;
  overflow-y:auto;
}

h1 {
  font-size:20px;
  margin:0 0 10px 0;
}

.section {
  margin-top:20px;
}

.item {
  border-bottom:1px solid #333;
  padding:8px 0;
  font-size:14px;
}

.badge {
  font-size:11px;
  padding:2px 6px;
  border-radius:3px;
  margin-right:6px;
  display:inline-block;
}

.file { background:#e67e22; }
.close { background:#e74c3c; }
.work { background:#f1c40f; color:#000; }

.small {
  font-size:12px;
  color:#aaa;
}

/* RECHTS */
#map {
  width:70%;
  height:100%;
}
</style>
</head>

<body>

<div id="container">
  <div id="sidebar">
    <h1>NL Snelwegen verkeer</h1>

    <div class="small" id="meta">Laden...</div>

    <div class="section">
      <h3>Files</h3>
      <div id="files"></div>
    </div>

    <div class="section">
      <h3>Afsluitingen</h3>
      <div id="closures"></div>
    </div>

    <div class="section">
      <h3>Werkzaamheden</h3>
      <div id="works"></div>
    </div>
  </div>

  <div id="map"></div>
</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

const BBOXES = [
  "3.0,50.7,5.2,51.8",
  "5.2,50.7,7.4,51.8",
  "3.0,51.8,5.2,52.8",
  "5.2,51.8,7.4,52.8",
  "3.0,52.8,5.2,53.8",
  "5.2,52.8,7.4,53.8"
];

let map;
let allIncidents = [];

function isHighway(roadNumbers) {
  if (!roadNumbers || roadNumbers.length === 0) return false;
  return roadNumbers.some(r => r.startsWith("A"));
}

function getType(i) {
  const cat = i.properties.iconCategory;
  const event = i.properties.events?.[0]?.description || "";

  if (cat === 8 && event.includes("Afgesloten")) return "closure";
  if (cat === 9 || event.includes("Wegwerkzaamheden")) return "work";
  return "file";
}

function initMap() {

  map = tt.map({
    key: API_KEY,
    container: "map",
    center: [5.3, 52.2],
    zoom: 7,
    dragPan: false,
    scrollZoom: false
  });

  map.on("load", () => {
    loadAll();
    setInterval(loadAll, 60000);
  });
}

async function loadAll() {

  let results = [];

  for (const box of BBOXES) {
    const url =
      `https://api.tomtom.com/traffic/services/5/incidentDetails` +
      `?bbox=${box}` +
      `&fields={incidents{type,geometry{type,coordinates},properties{id,iconCategory,from,to,length,delay,roadNumbers,events{description}}}}` +
      `&language=nl-NL&key=${API_KEY}`;

    const res = await fetch(url);
    const data = await res.json();

    if (data.incidents) {
      results = results.concat(data.incidents);
    }
  }

  allIncidents = results.filter(i => isHighway(i.properties.roadNumbers));

  renderSidebar();
  renderMap();

  document.getElementById("meta").innerHTML =
    "Laatste update: " + new Date().toLocaleTimeString();
}

function renderSidebar() {

  const files = document.getElementById("files");
  const closures = document.getElementById("closures");
  const works = document.getElementById("works");

  files.innerHTML = "";
  closures.innerHTML = "";
  works.innerHTML = "";

  let totalDelay = 0;

  allIncidents.forEach(i => {

    const p = i.properties;
    const type = getType(i);

    const road = (p.roadNumbers?.length)
      ? p.roadNumbers.join(", ")
      : "Onbekend";

    const title = `${road} ${p.from ? p.from + " → " + p.to : ""}`;
    const len = (p.length / 1000).toFixed(1);

    if (p.delay) totalDelay += p.delay;

    const div = document.createElement("div");
    div.className = "item";

    if (type === "closure") {

      div.innerHTML = `
        <span class="badge close">AFSLUITING</span>
        <b>${title}</b><br>
        ${len} km
      `;
      closures.appendChild(div);

    } else if (type === "work") {

      div.innerHTML = `
        <span class="badge work">WERKZAAMHEDEN</span>
        <b>${title}</b><br>
        ${len} km ${p.delay ? " | +" + Math.round(p.delay/60) + " min" : ""}
      `;
      works.appendChild(div);

    } else {

      div.innerHTML = `
        <span class="badge file">FILE</span>
        <b>${title}</b><br>
        ${len} km
      `;
      files.appendChild(div);
    }
  });

  document.getElementById("meta").innerHTML =
    `Incidenten: ${allIncidents.length} | Totale vertraging: ~${Math.round(totalDelay/60)} min`;
}

function renderMap() {

  document.querySelectorAll(".tt-polyline").forEach(e => e.remove());

  allIncidents.forEach(i => {

    const type = getType(i);
    const coords = i.geometry.coordinates;

    let color = "#ff9900";

    if (type === "closure") color = "#ff0000";
    if (type === "work") color = "#ffcc00";

    new tt.Polyline({
      map: map,
      coordinates: coords,
      color: color,
      width: 5
    });
  });
}

initMap();

</script>

</body>
</html>
