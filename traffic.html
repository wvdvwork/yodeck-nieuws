<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8"/>

<title>NL Traffic Fix</title>

<!-- ✅ FIX: TomTom CSS (DIT MIS JE NU) -->
<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<style>
body { margin:0; display:flex; height:100vh; font-family:Arial; }
#left { width:35%; overflow:auto; border-right:1px solid #ccc; padding:10px; }
#map { flex:1; }
.item { padding:8px; border-bottom:1px solid #eee; cursor:pointer; }
.item:hover { background:#f5f5f5; }
.badge { background:red; color:white; padding:2px 6px; font-size:12px; }
</style>
</head>

<body>

<div id="left"><b>Laden...</b></div>
<div id="map"></div>

<script>
const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

const map = tt.map({
  key: API_KEY,
  container: "map",
  center: [5.3, 52.1],
  zoom: 7
});

// ✅ FIX: kleine bbox tiles (GEEN NL in 1 request)
const tiles = [
  "3.0,50.7,5.0,51.6",
  "5.0,50.7,7.2,51.6",
  "3.0,51.6,5.0,52.6",
  "5.0,51.6,7.2,52.6",
  "3.0,52.6,5.0,53.6",
  "5.0,52.6,7.2,53.6"
];

function isHighway(roads){
  return (roads || []).some(r => r.startsWith("A"));
}

async function fetchTile(bbox){
  const url =
  "https://api.tomtom.com/traffic/services/5/incidentDetails" +
  "?bbox=" + bbox +
  "&fields={incidents{geometry{type,coordinates},properties{id,from,to,roadNumbers,events{description}}}}" +
  "&language=nl-NL&key=" + API_KEY;

  const res = await fetch(url);
  return res.json();
}

async function loadAll(){

  const results = await Promise.all(tiles.map(fetchTile));

  const mapData = new Map();

  results.forEach(r => {
    (r.incidents || []).forEach(i => {
      mapData.set(i.properties.id, i);
    });
  });

  return [...mapData.values()];
}

function render(data){

  const list = document.getElementById("left");
  list.innerHTML = "";

  data.forEach(i => {

    const p = i.properties;

    const closed = p.events?.some(e => e.description === "Afgesloten");
    if(!closed) return;
    if(!isHighway(p.roadNumbers)) return;

    const coords = i.geometry.coordinates.map(c => [c[0], c[1]]);

    const id = "line_" + p.id;

    map.addSource(id, {
      type: "geojson",
      data: {
        type: "Feature",
        geometry: {
          type: "LineString",
          coordinates: coords
        }
      }
    });

    map.addLayer({
      id: id,
      type: "line",
      source: id,
      paint: {
        "line-color": "#ff0000",
        "line-width": 4
      }
    });

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${p.from || "?"} → ${p.to || "?"}</b><br>
      <span class="badge">Afgesloten</span><br>
      ${(p.roadNumbers || []).join(", ")}
    `;

    div.onclick = () => map.fitBounds(coords, { padding: 80 });

    list.appendChild(div);
  });

  if(list.innerHTML === "") {
    list.innerHTML = "Geen snelweg afsluitingen gevonden";
  }
}

map.on("load", async () => {
  const data = await loadAll();
  render(data);
});
</script>

</body>
</html>
