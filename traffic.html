<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>NL Snelwegen - TomTom Traffic</title>

<!-- TomTom Maps SDK -->
<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<style>
body {
    margin: 0;
    display: flex;
    font-family: Arial;
}

#sidebar {
    width: 340px;
    background: #111;
    color: white;
    padding: 15px;
    height: 100vh;
    overflow-y: auto;
}

#map {
    flex: 1;
    height: 100vh;
}

.item {
    font-size: 12px;
    border-bottom: 1px solid #333;
    padding: 6px 0;
}

.small {
    font-size: 11px;
    color: #aaa;
}
</style>
</head>

<body>

<div id="sidebar">
    <h2>NL Snelwegen</h2>
    <div id="status">Laden...</div>
    <h3>Files & Afsluitingen</h3>
    <div id="list"></div>
</div>

<div id="map"></div>

<script>

// 🔑 API KEY
const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

// 🗺️ TOMTOM MAP
const map = tt.map({
    key: API_KEY,
    container: "map",
    center: [5.3, 52.1],
    zoom: 7
});

let layerGroup = [];

// 🚗 filter: alleen snelwegen
function isHighway(roadNumbers) {
    if (!roadNumbers) return false;
    return roadNumbers.some(r => /^A\d+/.test(r));
}

// 🚧 filter: files + afsluitingen
function isRelevant(events) {
    if (!events) return false;

    return events.some(e =>
        e.description?.toLowerCase().includes("file") ||
        e.description?.toLowerCase().includes("afgesloten")
    );
}

// 🔥 API call (TomTom Traffic)
const API_URL =
`https://api.tomtom.com/traffic/services/5/incidentDetails
?bbox=3.0%2C50.7%2C7.3%2C53.7
&fields=incidents{type,geometry,properties{id,from,to,roadNumbers,events}}
&language=nl-NL
&key=${API_KEY}`;

function clearMap() {
    layerGroup.forEach(l => l.remove());
    layerGroup = [];
}

async function loadTraffic() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();

        const incidents = data.incidents || [];

        clearMap();
        document.getElementById("list").innerHTML = "";

        let count = 0;

        for (const i of incidents) {
            const p = i.properties;

            if (!isHighway(p.roadNumbers)) continue;
            if (!isRelevant(p.events)) continue;

            count++;

            const coords = i.geometry.coordinates.map(c => [c[1], c[0]]);

            const isClosed = p.events.some(e =>
                e.description?.toLowerCase().includes("afgesloten")
            );

            const color = isClosed ? "red" : "orange";

            // 🔴 TomTom polyline
            const line = new tt.LngLatBounds();

            coords.forEach(c => line.extend(c));

            const polyline = new tt.Polyline({
                path: coords,
                color: color,
                width: 5
            }).addTo(map);

            layerGroup.push(polyline);

            // 📋 sidebar
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
                <b>${p.from} → ${p.to}</b><br>
                <span class="small">
                    ${(p.roadNumbers || []).join(", ")}<br>
                    ${(p.events || []).map(e => e.description).join(", ")}
                </span>
            `;

            document.getElementById("list").appendChild(div);
        }

        document.getElementById("status").innerHTML =
            `Laatste update: ${new Date().toLocaleTimeString()}<br>` +
            `Incidenten: ${count}`;

    } catch (err) {
        console.error(err);
        document.getElementById("status").innerHTML =
            "❌ API fout (check key / traffic access)";
    }
}

loadTraffic();
setInterval(loadTraffic, 60000);

</script>

</body>
</html>
