<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>TomTom Live Traffic NL</title>

<link rel="stylesheet"
href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>

body{
margin:0;
font-family:Arial;
background:#061428;
overflow:hidden;
color:white;
}

#header{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
background:#0e2446;
font-weight:bold;
}

#wrap{
display:flex;
height:calc(100vh - 60px);
}

#side{
width:380px;
background:#0b1b35;
overflow:auto;
padding:10px;
}

#map{
flex:1;
}

.inc{
background:rgba(255,255,255,0.06);
padding:10px;
margin-bottom:8px;
border-left:4px solid #ff9800;
border-radius:6px;
}

</style>
</head>

<body>

<div id="header">
<div>🚗 TomTom Live Traffic</div>
<div id="clock"></div>
</div>

<div id="wrap">
<div id="side">
<div id="stats">Laden...</div>
<div id="list"></div>
</div>
<div id="map"></div>
</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

function clock(){
document.getElementById("clock").innerText =
new Date().toLocaleTimeString("nl-NL");
}
setInterval(clock,1000);
clock();

/* MAP */
const map = tt.map({
key: API_KEY,
container: "map",
center: [5.3,52.2],
zoom: 7
});

map.on("load", () => {

map.fitBounds([
[3.0,50.6],
[7.4,53.7]
]);

/* 🔥 DIT IS DE ECHTE TOMTOM TRAFFIC ENGINE */
map.setTrafficFlow(true);
map.setTrafficIncidents(true);

loadIncidents();
setInterval(loadIncidents, 60000);

});

async function loadIncidents(){

const bbox = "3.0,50.6,7.4,53.7";

const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails
?bbox=${bbox}
&language=nl-NL
&key=${API_KEY}`;

const res = await fetch(url);
const data = await res.json();

const inc = data.incidents || [];

let html = "";

document.getElementById("stats").innerHTML =
`🚗 ${inc.length} incidenten live`;

inc.forEach(i=>{

const p = i.properties || {};

const road =
(p.roadNumbers||[]).join(", ") || "Onbekende weg";

html += `
<div class="inc">
<b>${road}</b><br>
${p.from||""} → ${p.to||""}
</div>
`;

});

document.getElementById("list").innerHTML = html;

}

</script>

</body>
</html>
