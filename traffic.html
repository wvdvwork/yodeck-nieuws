<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NL Traffic Clean</title>

<link rel="stylesheet"
href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>
body{margin:0;font-family:Arial;background:#061428;color:white;overflow:hidden;}
#wrap{display:flex;height:100vh;}
#side{width:360px;background:#0b1b35;overflow:auto;padding:10px;}
#map{flex:1;}
.inc{background:rgba(255,255,255,0.06);padding:10px;margin-bottom:8px;border-left:4px solid orange;}
</style>
</head>

<body>

<div id="wrap">
<div id="side">
<div id="stats">Laden...</div>
<div id="list"></div>
</div>
<div id="map"></div>
</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

/* MAP */
const map = tt.map({
    key: API_KEY,
    container: "map",
    center: [5.3, 52.2],
    zoom: 7,
    style: "basic_main"
});

/* 🔥 BELANGRIJK: traffic zit in STYLE LAYERS */
map.on("load", () => {

    map.fitBounds([
        [3.0, 50.6],
        [7.4, 53.7]
    ]);

    // traffic layer via style injection
    map.setStyle("basic_main");

    load();
    setInterval(load, 60000);
});

/* INCIDENT BBOX FIX */
const boxes = [
"3.0,50.6,5.0,52.0",
"5.0,50.6,7.4,52.0",
"3.0,52.0,5.0,53.7",
"5.0,52.0,7.4,53.7"
];

async function load(){

let all = [];

for(const bbox of boxes){

const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=nl-NL&key=${API_KEY}`;

const r = await fetch(url);
const d = await r.json();

if(Array.isArray(d.incidents)){
all.push(...d.incidents);
}

}

let html = "";
let km = 0;

all.forEach(i => {

const p = i.properties || {};
km += (p.length || 0);

html += `
<div class="inc">
<b>${(p.roadNumbers||[]).join(", ") || "Onbekend"}</b><br>
${p.from || ""} → ${p.to || ""}
</div>
`;

});

document.getElementById("stats").innerHTML =
`🚗 ${all.length} incidenten • 📏 ${(km/1000).toFixed(1)} km`;

document.getElementById("list").innerHTML = html;

}

</script>
</body>
</html>
