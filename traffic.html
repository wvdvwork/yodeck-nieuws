<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Verkeer Nederland Live</title>

<link rel="stylesheet"
href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#081030;
color:white;
height:100vh;
overflow:hidden;
}

#header{
height:90px;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 30px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
}

#title{
font-size:42px;
font-weight:800;
}

#clock{
font-size:28px;
}

#dashboard{
display:flex;
height:calc(100vh - 90px);
}

#left{
width:420px;
background:rgba(255,255,255,.04);
overflow-y:auto;
padding:20px;
}

#stats{
background:#13204f;
padding:15px;
border-radius:12px;
margin-bottom:20px;
font-size:20px;
font-weight:bold;
}

.incident{
padding:14px;
margin-bottom:12px;
border-radius:12px;
background:rgba(255,255,255,.08);
border-left:6px solid #ff9800;
}

.incident-title{
font-size:16px;
font-weight:bold;
margin-bottom:5px;
}

.incident-road{
font-size:14px;
opacity:.8;
}

.accident{
border-left-color:#ff4444;
}

.jam{
border-left-color:#ff9800;
}

.closed{
border-left-color:#9c27b0;
}

.roadworks{
border-left-color:#00bcd4;
}

#map{
flex:1;
}

</style>
</head>
<body>

<div id="header">
<div id="title">🚗 Verkeer Nederland</div>
<div id="clock"></div>
</div>

<div id="dashboard">

<div id="left">

<div id="stats">
Incidenten laden...
</div>

<div id="incidentList">
</div>

</div>

<div id="map"></div>

</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

let markers = [];

function updateClock(){

const now = new Date();

document.getElementById("clock").innerHTML =
now.toLocaleTimeString("nl-NL",{
hour:'2-digit',
minute:'2-digit'
});

}

setInterval(updateClock,1000);
updateClock();

const map = tt.map({
key:API_KEY,
container:"map",
center:[5.4,52.2],
zoom:7
});

map.addControl(new tt.NavigationControl());

map.on("load",()=>{

try{

map.addTier(
new tt.TrafficFlowTilesTier({
key:API_KEY,
style:"relative"
})
);

}catch(e){
console.log(e);
}

});

function categoryName(cat){

switch(cat){

case 1:
return "Ongeval";

case 6:
return "File";

case 7:
return "Rijstrook afgesloten";

case 8:
return "Weg afgesloten";

case 9:
return "Werkzaamheden";

case 14:
return "Pechgeval";

default:
return "Verkeersmelding";

}

}

function categoryClass(cat){

switch(cat){

case 1:
return "accident";

case 6:
return "jam";

case 8:
return "closed";

case 9:
return "roadworks";

default:
return "jam";

}

}

function markerColor(cat){

switch(cat){

case 1:
return "red";

case 6:
return "orange";

case 8:
return "purple";

case 9:
return "cyan";

default:
return "yellow";

}

}

async function loadIncidents(){

try{

markers.forEach(m=>m.remove());
markers=[];

const bbox = "3.2,50.7,7.3,53.7";

const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=nl-NL&fields={incidents{type,geometry{type,coordinates},properties{id,iconCategory,from,to,length,delay,roadNumbers,events{description}}}}&key=${API_KEY}`;

const res = await fetch(url);

const data = await res.json();

const incidents = data.incidents || [];

document.getElementById("stats").innerHTML =
`🚨 ${incidents.length} actuele incidenten`;

let html="";

incidents.slice(0,150).forEach(i=>{

const p = i.properties;

const category = p.iconCategory || 0;

const title = categoryName(category);

const road =
(p.roadNumbers && p.roadNumbers.length)
? p.roadNumbers.join(", ")
: "Onbekende weg";

const from = p.from || "";
const to = p.to || "";

html += `
<div class="incident ${categoryClass(category)}">

<div class="incident-title">
${title}
</div>

<div class="incident-road">
${road}
</div>

<div class="incident-road">
${from} ${to ? "→ "+to : ""}
</div>

</div>
`;

let coords;

if(
i.geometry &&
i.geometry.coordinates
){

if(i.geometry.type==="LineString"){

coords =
i.geometry.coordinates[
Math.floor(
i.geometry.coordinates.length/2
)
];

}else{

coords = i.geometry.coordinates;

}

if(coords){

const el = document.createElement("div");

el.style.width="12px";
el.style.height="12px";
el.style.borderRadius="50%";
el.style.background=markerColor(category);
el.style.border="2px solid white";

const marker =
new tt.Marker({element:el})
.setLngLat(coords)
.addTo(map);

markers.push(marker);

}

}

});

document.getElementById("incidentList").innerHTML =
html;

}catch(error){

console.error(error);

document.getElementById("stats").innerHTML =
"Fout bij laden incidenten";

}

}

loadIncidents();

setInterval(loadIncidents,60000);

</script>

</body>
</html>
