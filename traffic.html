<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>NL Traffic Incidents (TomTom)</title>

  <script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

  <style>
    body { margin: 0; font-family: Arial; }
    #map { height: 100vh; width: 100vw; }
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      z-index: 999;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>

<body>
<div class="info">NL snelweg afsluitingen (TomTom)</div>
<div id="map"></div>

<script>
const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

// 1. Map init
const map = tt.map({
  key: API_KEY,
  container: "map",
  center: [5.3, 52.1],
  zoom: 7
});

// 2. Nederland opgesplitst in kleinere bbox tiles (belangrijk!)
const tiles = [
  [3.0, 50.7, 5.0, 51.6],
  [5.0, 50.7, 7.2, 51.6],
  [3.0, 51.6, 5.0, 52.6],
  [5.0, 51.6, 7.2, 52.6],
  [3.0, 52.6, 5.0, 53.6],
  [5.0, 52.6, 7.2, 53.6]
];

// 3. alleen snelweg filtering
function isHighway(roadNumbers) {
  if (!roadNumbers) return false;
  return roadNumbers.some(r => r.startsWith("A"));
}

// 4. incidents ophalen per tile
async function fetchIncidents(bbox) {
  const url = `https://api.tomtom.com/traffic/services/5/incidentDetails` +
    `?bbox=${bbox.join(",")}` +
    `&fields={incidents{type,geometry{type,coordinates},properties{id,iconCategory,from,to,roadNumbers,events{description}}}}` +
    `&language=nl-NL&key=${API_KEY}`;

  const res = await fetch(url);
  const data = await res.json();
  return data.incidents || [];
}

// 5. alles laden
async function loadAll() {
  const all = await Promise.all(tiles.map(fetchIncidents));

  // flatten + dedupe
  const mapData = new Map();

  all.flat().forEach(i => {
    const id = i.properties.id;
    if (!mapData.has(id)) mapData.set(id, i);
  });

  return [...mapData.values()];
}

// 6. tekenen op map
function drawIncidents(incidents) {
  incidents.forEach(i => {
    const props = i.properties;

    // alleen afsluitingen
    const isClosed = props.events?.some(e => e.description === "Afgesloten");
    if (!isClosed) return;

    // alleen snelwegen
    if (!isHighway(props.roadNumbers)) return;

    const coords = i.geometry.coordinates.map(c => [c[0], c[1]]);

    map.addLayer({
      id: props.id,
      type: "line",
      source: {
        type: "geojson",
        data: {
          type: "Feature",
          geometry: {
            type: "LineString",
            coordinates: coords
          }
        }
      },
      paint: {
        "line-color": "#ff0000",
        "line-width": 4
      }
    });
  });
}

// 7. run
loadAll().then(drawIncidents);
</script>

</body>
</html>
