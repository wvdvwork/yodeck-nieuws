<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verkeer Nederland Flow + Incidenten</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#061428;color:white}
#header{padding:14px 20px;background:#0d1f3f;font-size:28px;font-weight:bold}
#wrap{display:flex;height:calc(100% - 58px)}
#sidebar{width:380px;background:#102247;padding:12px;overflow:auto}
#map{flex:1}
.card{background:rgba(255,255,255,.08);padding:10px;border-radius:8px;margin-bottom:8px}
</style>
</head>
<body>
<div id="header">Verkeer Nederland – Traffic Flow + Incidenten</div>
<div id="wrap">
  <div id="sidebar">
    <div class="card">Powered by TOMTOM</div>
    <div id="incidents"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
<script>
const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

const map = tt.map({
  key: API_KEY,
  container: "map",
  center: [5.3,52.2],
  zoom: 6.6
});

// Nederland iets verder uitgezoomd
map.fitBounds([[2.0,49.7],[8.8,54.5]], {padding:20});

// Traffic Flow laag
map.on("load", () => {
  map.addTier(tt.TrafficFlowTilesTier({
    key: API_KEY,
    style: "relative"
  }));
});

async function loadIncidents(){
  const box = "2.8,50.6,7.5,53.7";

  try{
    const res = await fetch(
      `https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${box}&language=nl-NL&key=${API_KEY}`
    );

    const data = await res.json();

    let html = "";

    (data.incidents || []).slice(0,50).forEach(i=>{
      const p = i.properties || {};
      const road = (p.roadNumbers || []).join(", ") || "Onbekende weg";

      html += `
      <div class="card">
        <b>${road}</b><br>
        ${p.from || ""} → ${p.to || ""}
      </div>`;
    });

    document.getElementById("incidents").innerHTML = html;

  }catch(e){
    console.error(e);
  }
}

loadIncidents();
setInterval(loadIncidents,60000);
</script>
</body>
</html>
