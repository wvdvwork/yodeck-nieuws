<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verkeer Nederland</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:radial-gradient(circle at top,#0a0f2c,#020051);
color:white;
overflow:hidden;
}

/* HEADER */
#header{
display:flex;
justify-content:space-between;
align-items:center;
padding:35px 45px 10px 45px;
}

#title{
font-size:54px;
font-weight:800;
letter-spacing:1px;
}

#clock{
font-size:32px;
opacity:0.8;
}

/* SUB */
#sub{
padding:0 45px;
opacity:0.7;
font-size:18px;
margin-bottom:20px;
}

/* LIST */
#list{
padding:0 45px;
display:flex;
flex-direction:column;
gap:14px;
}

/* CARD */
.row{
display:flex;
justify-content:space-between;
align-items:center;

padding:20px 22px;
border-radius:14px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.08);

font-size:26px;

transition:0.3s;
}

.row:hover{
transform:scale(1.01);
background:rgba(255,255,255,0.12);
}

/* LEFT */
.left{
display:flex;
align-items:center;
gap:12px;
}

/* BADGES */
.badge{
padding:6px 14px;
border-radius:999px;
font-size:18px;
font-weight:bold;
}

.good{ background:#1db954; }
.mid{ background:#ffb300; }
.bad{ background:#ff4d4d; }

/* FOOTER */
#footer{
position:absolute;
bottom:15px;
left:45px;
opacity:0.6;
font-size:16px;
}

</style>
</head>

<body>

<div id="header">
<div id="title">🚗 Verkeer Nederland</div>
<div id="clock"></div>
</div>

<div id="sub">Live verkeerssituatie • automatisch bijgewerkt</div>

<div id="list"></div>

<div id="footer">Powered by TomTom Traffic API</div>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

/* klok */
function clock(){
const d = new Date();
document.getElementById("clock").innerText =
d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
}
setInterval(clock,1000);
clock();

/* vaste punten */
const points = [
{ name:"A1 Amsterdam → Amersfoort", lat:52.37, lon:4.90 },
{ name:"A2 Amsterdam → Utrecht", lat:52.10, lon:5.12 },
{ name:"A12 Den Haag → Utrecht", lat:52.08, lon:4.31 },
{ name:"A27 Breda → Utrecht", lat:51.85, lon:4.80 },
{ name:"A50 Arnhem → Eindhoven", lat:51.98, lon:5.91 }
];

async function load(){

let html = "";

for(let p of points){

try{

const url =
`https://api.tomtom.com/traffic/services/4/flowSegmentData/relative0/10/json?point=${p.lat},${p.lon}&key=${API_KEY}`;

const res = await fetch(url);
const data = await res.json();

const cur = data.flowSegmentData.currentSpeed;
const free = data.flowSegmentData.freeFlowSpeed;

let ratio = cur/free;

let cls = "good";
let label = "VRIJ";

if(ratio < 0.6){ cls="bad"; label="FILE"; }
else if(ratio < 0.85){ cls="mid"; label="DRUK"; }

html += `
<div class="row">

<div class="left">
<span>🛣️</span>
<span>${p.name}</span>
</div>

<div class="badge ${cls}">
${label} • ${cur} km/h
</div>

</div>
`;

}catch(e){

html += `
<div class="row">
<div class="left">⚠️ ${p.name}</div>
<div class="badge mid">geen data</div>
</div>
`;

}

}

document.getElementById("list").innerHTML = html;

}

load();
setInterval(load,60000);

</script>

</body>
</html>
