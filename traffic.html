<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verkeer Nederland</title>

<link rel="stylesheet"
href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>
html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
}

#header{
    height:8%;
    background:#003b70;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
}

#content{
    display:flex;
    height:92%;
}

#map{
    width:72%;
    height:100%;
}

#side{
    width:28%;
    background:#111;
    color:white;
    padding:20px;
    box-sizing:border-box;
}

h2{
    margin-top:0;
}

.item{
    background:#222;
    padding:12px;
    margin-bottom:12px;
    border-radius:8px;
    font-size:18px;
}

.red{
    border-left:8px solid red;
}

.orange{
    border-left:8px solid orange;
}

.green{
    border-left:8px solid lime;
}

.small{
    font-size:14px;
    color:#ccc;
}

</style>
</head>


<body>

<div id="header">
🚗 VERKEER NEDERLAND
</div>

<div id="content">

<div id="map"></div>

<div id="side">

<h2>Files</h2>

<div id="files">
Laden...
</div>

<div class="small">
Laatste update:
<span id="time"></span>
</div>

</div>

</div>


<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>


<script>

const TOMTOM_KEY="M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";


// Kaart

const map = tt.map({

    key:TOMTOM_KEY,

    container:"map",

    center:[5.4,52.2],

    zoom:7,

    style:"https://api.tomtom.com/style/2/basic_main.json"

});


// Verkeerslaag

map.on("load",function(){

    map.addSource("traffic",{

        type:"raster",

        tiles:[
        "https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key="
        + TOMTOM_KEY
        ],

        tileSize:256
    });


    map.addLayer({

        id:"traffic",

        type:"raster",

        source:"traffic",

        opacity:0.8

    });


});



// Incidenten ophalen

async function loadTraffic(){

try{

let url =
"https://api.tomtom.com/traffic/services/5/incidentDetails"
+
"?bbox=3.3,50.7,7.3,53.6"
+
"&key="+TOMTOM_KEY;


let response=await fetch(url);

let data=await response.json();


let html="";


if(data.tm && data.tm.poi){


data.tm.poi.slice(0,8).forEach(function(f){


let kleur="orange";


if(f.ic){
kleur="red";
}


html +=
`
<div class="item ${kleur}">
<b>${f.dl || "Verkeersmelding"}</b><br>
${f.f || ""}
</div>
`;

});


}


if(html===""){
html='<div class="item green">Geen grote files gemeld</div>';
}


document.getElementById("files").innerHTML=html;


}

catch(e){

document.getElementById("files").innerHTML=
'<div class="item red">Kan verkeersdata niet laden</div>';

}


document.getElementById("time").innerHTML =
new Date().toLocaleTimeString("nl-NL");


}


loadTraffic();


// elke minuut vernieuwen

setInterval(loadTraffic,60000);


</script>

</body>
</html>
