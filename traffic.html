<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verkeer Nederland Pro</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#061428;color:#fff;height:100vh;overflow:hidden}

#header{
height:72px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 24px;
background:#0d1f3f;
border-bottom:1px solid rgba(255,255,255,.08);
}

#title{font-size:34px;font-weight:800}
#clock{font-size:22px}

#layout{
display:flex;
height:calc(100vh - 72px);
}

#sidebar{
width:420px;
background:#102247;
padding:14px;
overflow-y:auto;
}

#map{flex:1}

.card{
background:rgba(255,255,255,.08);
border-radius:10px;
padding:12px;
margin-bottom:10px;
}

#stats{
font-size:18px;
font-weight:bold;
}

#powered{
text-align:center;
color:#8ec5ff;
font-weight:bold;
letter-spacing:2px;
}

.incident{
border-left:6px solid #ff6d00;
}

.inc-title{
font-weight:bold;
margin-bottom:4px;
}

.inc-sub{
font-size:12px;
opacity:.85;
}

.mapboxgl-ctrl-bottom-right{
right:10px!important;
bottom:10px!important;
}
</style>
</head>
<body>

<div id="header">
  <div id="title">Verkeer Nederland</div>
  <div id="clock"></div>
</div>

<div id="layout">
  <div id="sidebar">
    <div id="stats" class="card">Laden...</div>
    <div id="powered" class="card">POWERED BY TOMTOM</div>
    <div id="updated" class="card">Laatste update: --:--</div>
    <div id="incidentList"></div>
  </div>

  <div id="map"></div>
</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>
const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

function updateClock(){
 document.getElementById("clock").textContent =
 new Date().toLocaleTimeString("nl-NL");
}
setInterval(updateClock,1000);
updateClock();

const map = tt.map({
 key: API_KEY,
 container: "map",
 center: [5.2,52.1],
 zoom: 6.6
});

map.dragPan.disable();
map.scrollZoom.disable();
map.doubleClickZoom.disable();

let lines=[];

function clearLines(){
 lines.forEach(id=>{
   if(map.getLayer(id)) map.removeLayer(id);
   if(map.getSource(id)) map.removeSource(id);
 });
 lines=[];
}

function colorByKm(km){
 if(km >= 10) return "#ff0000";
 if(km >= 5) return "#ff7a00";
 return "#ffd400";
}

async function loadIncidents(){

 clearLines();

 const boxes=[
 "3.2,50.7,5.0,52.0",
 "5.0,50.7,7.3,52.0",
 "3.2,52.0,5.0,53.7",
 "5.0,52.0,7.3,53.7"
 ];

 let all=[];
 let totalKm=0;

 try{

   for(const bbox of boxes){

     const res = await fetch(
      `https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=nl-NL&key=${API_KEY}`
     );

     const data = await res.json();

     if(data.incidents){
        all.push(...data.incidents);
     }
   }

   let html="";

   all.slice(0,50).forEach((i,index)=>{

      const p=i.properties||{};

      const road=(p.roadNumbers||[]).join(", ") || "Onbekende weg";
      const km=(p.length||0)/1000;

      totalKm += km;

      html += `
      <div class="card incident">
         <div class="inc-title">${road}</div>
         <div class="inc-sub">${p.from||""} → ${p.to||""}</div>
         <div class="inc-sub">${km.toFixed(1)} km</div>
      </div>`;

      if(i.geometry && i.geometry.coordinates){

         const coords =
           i.geometry.type === "LineString"
           ? i.geometry.coordinates
           : [i.geometry.coordinates];

         const id = "line"+index;

         map.addSource(id,{
           type:"geojson",
           data:{
             type:"Feature",
             geometry:{
               type:"LineString",
               coordinates:coords
             }
           }
         });

         map.addLayer({
           id:id,
           type:"line",
           source:id,
           paint:{
             "line-color":colorByKm(km),
             "line-width": km >= 10 ? 10 : (km >= 5 ? 8 : 6)
           }
         });

         lines.push(id);
      }
   });

   document.getElementById("stats").innerHTML =
     `🚨 ${all.length} incidenten<br>📏 ${totalKm.toFixed(1)} km file`;

   document.getElementById("incidentList").innerHTML = html;

   document.getElementById("updated").innerHTML =
     "Laatste update: " +
     new Date().toLocaleTimeString("nl-NL");

 }catch(err){
   console.error(err);
 }
}

loadIncidents();
setInterval(loadIncidents,60000);

// volledige reload elke 6 uur voor signage
setInterval(()=>location.reload(),21600000);
</script>

</body>
</html>
