<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>NL Snelwegen Live Traffic</title>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<style>
body {
    margin: 0;
    display: flex;
    font-family: Arial;
}

#sidebar {
    width: 340px;
    background: #111;
    color: white;
    padding: 15px;
    height: 100vh;
    overflow-y: auto;
}

#map {
    flex: 1;
    height: 100vh;
}

.item {
    font-size: 12px;
    padding: 6px;
    border-bottom: 1px solid #333;
}

.small {
    font-size: 11px;
    color: #aaa;
}
</style>
</head>

<body>

<div id="sidebar">
    <h2>🚗 NL Snelwegen</h2>
    <div id="status">Laden...</div>
    <h3>Files & Afsluitingen</h3>
    <div id="list"></div>
</div>

<div id="map"></div>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

// 🗺 TomTom map
const map = tt.map({
    key: API_KEY,
    container: "map",
    center: [5.3, 52.1],
    zoom: 7
});

// 📦 bbox in 3 delen (fix voor 10.000 km² limit)
const BBOXES = [
    "3.0%2C52.8%2C7.3%2C53.7", // noord
    "3.0%2C51.8%2C7.3%2C52.8", // midden
    "3.0%2C50.7%2C7.3%2C51.8"  // zuid
];

let objects = [];

// 🚗 snelweg filter
function isHighway(roads) {
    if (!roads) return false;
    return roads.some(r => /^A\d+/.test(r));
}

// 🚧 file / afsluiting filter
function isRelevant(events) {
    if (!events) return false;

    return events.some(e => {
        const d = (e.description || "").toLowerCase();
        return d.includes("file") || d.includes("afgesloten");
    });
}

// 🧹 cleanup
function clearMap() {
    objects.forEach(o => o.remove());
    objects = [];
}

// 🌐 API call per bbox
async function fetchBox(bbox) {
    const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails
?bbox=${bbox}
&fields=incidents{type,geometry,properties{id,from,to,roadNumbers,events}}
&language=nl-NL
&key=${API_KEY}`;

    const res = await fetch(url);
    return (await res.json()).incidents || [];
}

// 🔄 main loader
async function loadTraffic() {
    try {
        clearMap();
        document.getElementById("list").innerHTML = "";

        let allIncidents = [];

        // 🔥 meerdere requests parallel
        const results = await Promise.all(BBOXES.map(fetchBox));

        results.forEach(r => allIncidents.push(...r));

        let count = 0;

        for (const i of allIncidents) {

            const p = i.properties;

            if (!isHighway(p.roadNumbers)) continue;
            if (!isRelevant(p.events)) continue;

            count++;

            const coords = i.geometry.coordinates.map(c => [c[1], c[0]]);

            const isClosed = p.events.some(e =>
                (e.description || "").toLowerCase().includes("afgesloten")
            );

            const color = isClosed ? "red" : "orange";

            // 🟠 polyline
            const line = new tt.Polyline({
                path: coords,
                color: color,
                width: 5
            }).addTo(map);

            objects.push(line);

            // 📋 sidebar
            const div = document.createElement("div");
            div.className = "item";

            div.innerHTML = `
                <b>${p.from} → ${p.to}</b><br>
                <span class="small">
                    ${(p.roadNumbers || []).join(", ")}<br>
                    ${(p.events || []).map(e => e.description).join(", ")}
                </span>
            `;

            document.getElementById("list").appendChild(div);
        }

        document.getElementById("status").innerHTML =
            `Laatste update: ${new Date().toLocaleTimeString()}<br>` +
            `Actieve incidenten: ${count}`;

    } catch (err) {
        console.error(err);
        document.getElementById("status").innerHTML =
            "❌ Fout bij laden (check API key / traffic access)";
    }
}

loadTraffic();
setInterval(loadTraffic, 60000);

</script>

</body>
</html>
