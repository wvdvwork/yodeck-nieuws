<!DOCTYPE html>

<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Verkeer Nederland Live</title>

<link rel="stylesheet"
href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>

html,body{
margin:0;
padding:0;
height:100%;
background:#061428;
font-family:Arial,sans-serif;
overflow:hidden;
}

#header{
height:70px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#0d1f3d;
color:#fff;
}

#dashboard{
display:flex;
height:calc(100vh - 70px);
}

#sidebar{
width:400px;
overflow-y:auto;
background:#0f2246;
padding:15px;
color:white;
}

#map{
flex:1;
}

#stats{
background:#18356c;
padding:12px;
border-radius:10px;
margin-bottom:10px;
font-weight:bold;
}

.incident{
background:rgba(255,255,255,.08);
padding:10px;
margin-bottom:8px;
border-radius:8px;
border-left:5px solid orange;
}

.road{
font-weight:bold;
margin-bottom:4px;
}

.small{
font-size:12px;
opacity:.8;
}

</style>

</head>
<body>

<div id="header">
<h2>🚗 Verkeer Nederland</h2>
<div id="clock"></div>
</div>

<div id="dashboard">

<div id="sidebar">
<div id="stats">Laden...</div>
<div id="incidentList"></div>
</div>

<div id="map"></div>

</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

function updateClock(){
document.getElementById("clock").innerHTML =
new Date().toLocaleTimeString("nl-NL");
}

setInterval(updateClock,1000);
updateClock();

const map = tt.map({
key: API_KEY,
container: "map",
center:[5.3,52.2],
zoom:7,

styleVisibility:{
trafficFlow:true,
trafficIncidents:true
}
});

map.on("load",()=>{

map.fitBounds([
[3.0,50.6],
[7.4,53.7]
]);

loadIncidents();

setInterval(loadIncidents,60000);

});

async function loadIncidents(){

try{

const bbox = "3.0,50.6,7.4,53.7";

const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&fields={incidents{type,geometry{type,coordinates},properties{id,iconCategory,length,from,to,roadNumbers,events{description}}}}&language=nl-NL&key=${API_KEY}`;

const res = await fetch(url);

const data = await res.json();

const incidents = data.incidents || [];

let totalLength = 0;

let html = "";

incidents.forEach(item=>{

const p = item.properties || {};

totalLength += p.length || 0;

const road =
(p.roadNumbers || []).join(", ") ||
"Onbekende weg";

const event =
p.events?.[0]?.description || "Incident";

html += `
<div class="incident">
<div class="road">${road}</div>
<div>${event}</div>
<div class="small">${p.from || ""}</div>
<div class="small">${p.to || ""}</div>
</div>
`;

});

document.getElementById("stats").innerHTML =
`🚨 ${incidents.length} incidenten<br>
📏 ${(totalLength/1000).toFixed(1)} km totaal`;

document.getElementById("incidentList").innerHTML =
html;

}
catch(err){

console.error(err);

document.getElementById("stats").innerHTML =
"Fout bij laden";

}

}

</script>

</body>
</html>
