<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard NL + BBOX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: white;
  }

  #layout {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  #files {
    width: 30%;
    background: #111;
    padding: 15px;
    overflow-y: auto;
    box-sizing: border-box;
    border-right: 2px solid #222;
  }

  #map {
    width: 70%;
    height: 100%;
  }

  .file {
    background: #1c1c1c;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
  }
</style>
</head>

<body>

<div id="layout">
  <div id="files">
    <h2>📁 Files</h2>
    <div id="fileList"></div>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* =========================
   CONFIG
========================= */
const apiKey = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

/* =========================
   FILES (demo)
========================= */
const files = [
  "rapport.pdf",
  "planning.xlsx",
  "routes.csv",
  "incident.log"
];

const fileList = document.getElementById("fileList");

files.forEach(f => {
  const div = document.createElement("div");
  div.className = "file";
  div.textContent = "📄 " + f;
  fileList.appendChild(div);
});

/* =========================
   MAP INIT
========================= */
const map = L.map('map').setView([52.1, 5.3], 7);

/* Base map */
L.tileLayer(
  `https://api.tomtom.com/map/1/tile/basic/main/{z}/{x}/{y}.png?key=${apiKey}`,
  { maxZoom: 18 }
).addTo(map);

/* Traffic Flow (TomTom kleuren) */
L.tileLayer(
  `https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key=${apiKey}`,
  { opacity: 0.7 }
).addTo(map);

/* Incidents */
L.tileLayer(
  `https://api.tomtom.com/traffic/map/4/tile/incidents/{z}/{x}/{y}.png?key=${apiKey}`,
  { opacity: 0.9 }
).addTo(map);

/* =========================
   BBOX 4 REGIO'S NEDERLAND
========================= */
const regions = [
  {
    name: "NW",
    bbox: [[53.6, 3.2], [52.8, 5.5]],
    color: "#00ff88"
  },
  {
    name: "NE",
    bbox: [[53.6, 5.5], [52.8, 7.3]],
    color: "#00aaff"
  },
  {
    name: "SW",
    bbox: [[52.8, 3.2], [50.7, 5.5]],
    color: "#ffaa00"
  },
  {
    name: "SE",
    bbox: [[52.8, 5.5], [50.7, 7.3]],
    color: "#ff3366"
  }
];

/* =========================
   DRAW REGIONS
========================= */
regions.forEach(r => {
  L.rectangle(r.bbox, {
    color: r.color,
    weight: 2,
    fillOpacity: 0.08
  }).addTo(map).bindPopup(`Regio: ${r.name}`);
});
</script>

</body>
</html>
