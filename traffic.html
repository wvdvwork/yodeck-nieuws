<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NL TomTom Live Traffic</title>

<link rel="stylesheet"
href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>

body{
margin:0;
font-family:Arial;
background:#061428;
overflow:hidden;
color:white;
}

#header{
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
background:#0e2246;
font-weight:bold;
}

#wrap{
display:flex;
height:calc(100vh - 60px);
}

#side{
width:380px;
background:#0b1b35;
overflow:auto;
padding:10px;
}

#map{
flex:1;
}

.inc{
background:rgba(255,255,255,0.06);
padding:10px;
margin-bottom:8px;
border-left:4px solid #ff9800;
border-radius:6px;
font-size:13px;
}

.small{
font-size:11px;
opacity:.8;
}

</style>
</head>

<body>

<div id="header">
<div>🚗 TomTom Live Traffic NL</div>
<div id="clock"></div>
</div>

<div id="wrap">
<div id="side">
<div id="stats">Laden...</div>
<div id="list"></div>
</div>
<div id="map"></div>
</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

/* CLOCK */
function clock(){
document.getElementById("clock").innerText =
new Date().toLocaleTimeString("nl-NL");
}
setInterval(clock,1000);
clock();

/* MAP */
const map = tt.map({
key: API_KEY,
container: "map",
center: [5.3, 52.2],
zoom: 7
});

map.on("load", () => {

map.fitBounds([
[3.0, 50.6],
[7.4, 53.7]
]);

/* 🔥 OFFICIËLE TOMTOM TRAFFIC TIER (DIT IS DE FIX) */
const trafficFlow = new tt.TrafficFlowTilesTier({
key: API_KEY,
style: "relative"
});

const trafficIncidents = new tt.TrafficIncidentTier({
key: API_KEY,
style: "s1"
});

map.addTier(trafficFlow);
map.addTier(trafficIncidents);

/* load incident list */
load();
setInterval(load, 60000);

});

/* BBOX FIX (TomTom limit 10.000 km2) */
const boxes = [
"3.0,50.6,5.0,52.0",
"5.0,50.6,7.4,52.0",
"3.0,52.0,5.0,53.7",
"5.0,52.0,7.4,53.7"
];

async function load(){

let all = [];

for(const bbox of boxes){

const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=nl-NL&key=${API_KEY}`;

const res = await fetch(url);
const data = await res.json();

if(Array.isArray(data.incidents)){
all.push(...data.incidents);
}
else if(data.incidents?.features){
all.push(...data.incidents.features);
}

}

let html = "";
let km = 0;

all.forEach(i => {

const p = i.properties || {};
km += (p.length || 0);

const road =
(p.roadNumbers || []).join(", ") || "Onbekend";

html += `
<div class="inc">
<b>${road}</b><br>
<span class="small">${p.from || ""} → ${p.to || ""}</span>
</div>
`;

});

document.getElementById("stats").innerHTML =
`🚗 ${all.length} incidenten • 📏 ${(km/1000).toFixed(1)} km file`;

document.getElementById("list").innerHTML = html;

}

</script>

</body>
</html>
