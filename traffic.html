<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TomTom files Nederland</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
header{background:#123a6f;padding:20px;font-size:42px;font-weight:bold}
#time{float:right;font-size:22px}
table{width:100%;border-collapse:collapse}
th,td{padding:14px;border-bottom:1px solid #333;text-align:left}
th{background:#222}
.red{color:#ff5b5b}.orange{color:#ffbf47}.green{color:#6be675}
</style></head><body>
<header>🚗 Actuele files Nederland <span id="time"></span></header>
<table><thead><tr><th>Weg</th><th>Omschrijving</th><th>Lengte</th></tr></thead><tbody id="rows"><tr><td colspan="3">Laden...</td></tr></tbody></table>
<script>
const API_KEY="M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";
const bbox="3.314971,50.750383,7.227510,53.555214";
async function load(){
 document.getElementById('time').textContent=new Date().toLocaleTimeString('nl-NL');
 const url=`https://api.tomtom.com/traffic/services/5/incidentDetails?key=${API_KEY}&bbox=${bbox}&fields={incidents{type,properties{roadNumbers,length,events{description}}}}&language=nl-NL`;
 try{
   const r=await fetch(url);
   const j=await r.json();
   const tb=document.getElementById('rows'); tb.innerHTML='';
   const arr=(j.incidents||[]).sort((a,b)=>(b.properties?.length||0)-(a.properties?.length||0));
   if(!arr.length){tb.innerHTML="<tr><td colspan='3'>Geen files gevonden.</td></tr>";return;}
   arr.slice(0,20).forEach(i=>{
      const l=i.properties?.length||0;
      const cls=l>8000?"red":l>3000?"orange":"green";
      const road=(i.properties?.roadNumbers||["Onbekend"]).join(", ");
      const desc=(i.properties?.events?.[0]?.description)||"Verkeershinder";
      tb.insertAdjacentHTML("beforeend",`<tr><td>${road}</td><td>${desc}</td><td class="${cls}">${(l/1000).toFixed(1)} km</td></tr>`);
   });
 }catch(e){
   document.getElementById('rows').innerHTML="<tr><td colspan='3'>Fout bij ophalen TomTom API. Controleer endpoint/API-key/CORS.</td></tr>";
 }
}
load();setInterval(load,30000);
</script></body></html>
