// FILES OPHALEN

async function loadTraffic(){

+
"?key="+TOMTOM_KEY
+

data.tm.poi.slice(0,10).forEach(function(item){


let kleur="orange";


if(item.ic){

}


html += `

<div class="item ${kleur}">
<b>${item.dl || "Verkeersmelding"}</b><br>
${item.f || ""}
</div>

`;

});


}


if(html===""){

html=
'<div class="item green">Geen grote files gemeld</div>';

}


document.getElementById("files").innerHTML=html;


}

catch(error){


console.log(error);


document.getElementById("files").innerHTML=

'<div class="item red">Geen verkeersdata</div>';

}


document.getElementById("time").innerHTML =
new Date().toLocaleTimeString("nl-NL");


}

setInterval(loadTraffic,60000);
