<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Verkeer Nederland</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
}

#container{
    display:flex;
    width:100%;
    height:100%;
}

#sidebar{
    width:380px;
    background:#1b1b1b;
    color:white;
    padding:20px;
    box-sizing:border-box;
    overflow-y:auto;
}

#map{
    flex:1;
}

.stat{
    font-size:34px;
    font-weight:bold;
    margin-bottom:20px;
}

.label{
    font-size:14px;
    color:#aaa;
}

.incident{
    padding:10px;
    margin-bottom:10px;
    border-left:4px solid #ff9800;
    background:#2a2a2a;
}

.incident h4{
    margin:0 0 5px 0;
    font-size:15px;
}

.incident p{
    margin:0;
    color:#ddd;
    font-size:13px;
}

.footer{
    margin-top:20px;
    font-size:12px;
    color:#888;
}
</style>
</head>

<body>

<div id="container">

    <div id="sidebar">

        <h1>🇳🇱 Verkeer Nederland</h1>

        <div class="label">Actieve incidenten</div>
        <div id="incidentCount" class="stat">-</div>

        <div class="label">Totale filelengte</div>
        <div id="jamLength" class="stat">- km</div>

        <div class="label">Laatste update</div>
        <div id="lastUpdate">-</div>

        <hr>

        <div id="incidentList"></div>

        <div class="footer">
            Powered by TOMTOM
        </div>

    </div>

    <div id="map"></div>

</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

const BBOXES = [
    "3.2,50.7,4.5,51.6",
    "4.5,50.7,5.8,51.6",
    "5.8,50.7,7.3,51.6",

    "3.2,51.6,4.5,52.6",
    "4.5,51.6,5.8,52.6",
    "5.8,51.6,7.3,52.6",

    "3.2,52.6,5.0,53.8",
    "5.0,52.6,7.3,53.8"
];

const map = tt.map({
    key: API_KEY,
    container: "map",
    center: [5.3,52.2],
    zoom: 7,
    style: "https://api.tomtom.com/style/2/custom/style/dG9tdG9tQEBAZDY4YjJlMzgtY2U3NS00NzY4LWFjY2EtOWY5YzY5MjIxNmUw/draft?sdkVersion=6.x&key=" + API_KEY
});

map.addControl(new tt.NavigationControl());

let markers=[];

async function loadIncidents(){

    markers.forEach(m=>m.remove());
    markers=[];

    let incidents=[];

    for(const bbox of BBOXES){

        try{

            const url=
            `https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=nl-NL&key=${API_KEY}`;

            const response=await fetch(url);

            if(!response.ok){
                console.error(bbox,response.status);
                continue;
            }

            const data=await response.json();

            if(data.tm && data.tm.poi){
                incidents.push(...data.tm.poi);
            }

        }catch(e){
            console.error(e);
        }
    }

    document.getElementById("incidentCount").innerText=
        incidents.length;

    let totalLength=0;

    incidents.forEach(i=>{

        if(i.d && i.d.v && i.d.v.l){
            totalLength+=i.d.v.l;
        }

        if(i.p && i.p.x && i.p.y){

            const marker=new tt.Marker({
                color:"#ff3b30"
            })
            .setLngLat([i.p.x,i.p.y])
            .addTo(map);

            markers.push(marker);
        }

    });

    document.getElementById("jamLength").innerText=
        (totalLength/1000).toFixed(1)+" km";

    document.getElementById("lastUpdate").innerText=
        new Date().toLocaleTimeString("nl-NL");

    renderIncidentList(incidents);
}

function renderIncidentList(incidents){

    const list=document.getElementById("incidentList");

    list.innerHTML="";

    incidents.slice(0,25).forEach(i=>{

        const div=document.createElement("div");
        div.className="incident";

        const title=
            i.ic ||
            "Verkeersincident";

        const delay=
            i.d && i.d.v && i.d.v.l
            ? (i.d.v.l/1000).toFixed(1)+" km"
            : "";

        div.innerHTML=`
            <h4>${title}</h4>
            <p>${delay}</p>
        `;

        list.appendChild(div);
    });
}

loadIncidents();

setInterval(loadIncidents,60000);

setTimeout(()=>{
    location.reload();
},21600000);

</script>

</body>
</html>
