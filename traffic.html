<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verkeer Nederland</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#061428;color:white;height:100vh;overflow:hidden;}

#header{
display:flex;justify-content:space-between;align-items:center;
padding:16px 24px;background:rgba(255,255,255,.05);
}

#title{
font-size:36px;font-weight:800;color:#fff;
text-shadow:0 0 10px rgba(255,255,255,.15);
}

#clock{font-size:20px;opacity:.8;}

#dashboard{display:flex;height:calc(100vh - 65px);}

#left{
width:420px;padding:16px;overflow-y:auto;
background:rgba(255,255,255,.03);
}

#stats{
background:#14264f;padding:12px;border-radius:10px;
margin-bottom:10px;font-weight:bold;
}

#powered{
margin:12px 0 18px 0;
padding:12px;
text-align:center;
background:rgba(255,255,255,.05);
border-radius:10px;
font-size:13px;
font-weight:700;
letter-spacing:1px;
text-transform:uppercase;
color:#8ec5ff;
}

#status{margin-bottom:10px;font-size:14px;opacity:.85;}

.incident{
background:rgba(255,255,255,.06);
padding:10px;border-radius:10px;
margin-bottom:8px;
}

.incident-title{font-size:14px;font-weight:bold;}
.incident-sub{font-size:12px;opacity:.8;}

#map{flex:1;}

.mapboxgl-ctrl-bottom-right{
right:10px !important;
bottom:10px !important;
}
</style>
</head>
<body>

<div id="header">
<div id="title">Verkeer Nederland</div>
<div id="clock"></div>
</div>

<div id="dashboard">
<div id="left">
<div id="stats">Laden...</div>
<div id="powered">Powered by TOMTOM</div>
<div id="status"></div>
<div id="incidentList"></div>
</div>
<div id="map"></div>
</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>
const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

function clock(){
const d=new Date();
document.getElementById("clock").innerText =
d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
}
setInterval(clock,1000);
clock();

const map = tt.map({
key:API_KEY,
container:"map",
center:[5.3,52.2],
zoom:7
});

const nlBounds=[[2.2,49.9],[8.6,54.3]];
map.fitBounds(nlBounds,{padding:20});
map.setMaxBounds(nlBounds);

map.once("idle",()=>{
map.zoomTo(map.getZoom()-0.6);
});

let markers=[];
let lines=[];

function colorByLength(km){
if(km>10) return "#ff2d2d";
if(km>3) return "#ff9800";
return "#ffcc00";
}

function isRoadClosed(props){
const txt=JSON.stringify(props).toLowerCase();
return txt.includes("closure") ||
txt.includes("closed") ||
txt.includes("road closed") ||
txt.includes("afgesloten");
}

function clearMap(){
markers.forEach(m=>m.remove());
markers=[];

lines.forEach(id=>{
if(map.getLayer(id)) map.removeLayer(id);
if(map.getSource(id)) map.removeSource(id);
});
lines=[];
}

async function loadIncidents(){
try{

clearMap();

let all=[];
let totalKm=0;

const boxes=[
"3.2,50.7,5.0,52.0",
"5.0,50.7,7.3,52.0",
"3.2,52.0,5.0,53.7",
"5.0,52.0,7.3,53.7"
];

for(const bbox of boxes){

const url=`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=nl-NL&key=${API_KEY}`;

const res=await fetch(url);
const data=await res.json();

if(data.incidents){
all.push(...data.incidents);
}
}

if(all.length===0){
document.getElementById("stats").innerHTML="🚨 0 incidenten • 📏 0 km file";
document.getElementById("status").innerHTML="✔ Geen files op dit moment — alle wegen vrij";
document.getElementById("incidentList").innerHTML="";
return;
}

all.forEach(i=>{
const p=i.properties||{};
if(p.length) totalKm+=p.length;
});

totalKm/=1000;

document.getElementById("stats").innerHTML=
`🚨 ${all.length} incidenten • 📏 ${totalKm.toFixed(1)} km file`;

let html="";

all.forEach((i,idx)=>{

const p=i.properties||{};
const road=(p.roadNumbers||[]).join(", ") || "Onbekende weg";
const km=(p.length||0)/1000;

const closed=isRoadClosed(p);

html += `
<div class="incident" style="border-left:6px solid ${closed ? '#000000' : colorByLength(km)}">
<div class="incident-title">${closed ? '⛔ Weg afgesloten' : '🚗 Verkeersincident'}</div>
<div class="incident-sub">${road}</div>
<div class="incident-sub">${p.from || ""} → ${p.to || ""}</div>
</div>`;

if(i.geometry && i.geometry.coordinates){

let coords=i.geometry.type==="LineString"
? i.geometry.coordinates
: [i.geometry.coordinates];

let color,width;

if(closed){
color="#000000";
width=8;
}else{
color=colorByLength(km);
width=5;
}

const id="line"+idx;

map.addSource(id,{
type:"geojson",
data:{
type:"Feature",
geometry:{
type:"LineString",
coordinates:coords
}
}
});

map.addLayer({
id:id,
type:"line",
source:id,
paint:{
"line-color":color,
"line-width":width
}
});

lines.push(id);
}
});

document.getElementById("incidentList").innerHTML=html;

}catch(err){
console.error(err);
document.getElementById("stats").innerHTML="Fout bij laden data";
}
}

loadIncidents();
setInterval(loadIncidents,60000);
</script>
</body>
</html>
