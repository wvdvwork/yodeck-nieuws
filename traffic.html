<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Verkeer Nederland Pro</title>

<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#061428;color:#fff;height:100vh;overflow:hidden}
#header{height:70px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;background:#0d1f3f}
#title{font-size:34px;font-weight:800}
#clock{font-size:22px}
#dashboard{display:flex;height:calc(100vh - 70px)}
#sidebar{width:420px;background:#102247;padding:15px;overflow:auto}
#map{flex:1}
.card{background:rgba(255,255,255,.08);border-radius:10px;padding:12px;margin-bottom:10px}
#stats{font-size:18px;font-weight:bold}
#powered{text-align:center;color:#8ec5ff;letter-spacing:2px;font-weight:bold}
.incident{border-left:6px solid #ff6d00}
</style>
</head>
<body>

<div id="header">
  <div id="title">Verkeer Nederland</div>
  <div id="clock"></div>
</div>

<div id="dashboard">
  <div id="sidebar">
      <div id="stats" class="card">Laden...</div>
      <div id="powered" class="card">POWERED BY TOMTOM</div>
      <div id="incidentList"></div>
  </div>
  <div id="map"></div>
</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>
const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

function updateClock(){
 document.getElementById("clock").innerHTML =
 new Date().toLocaleTimeString("nl-NL");
}
setInterval(updateClock,1000);
updateClock();

const map = tt.map({
 key:API_KEY,
 container:"map",
 center:[5.3,52.2],
 zoom:6.6
});

map.fitBounds([[2.0,49.7],[8.8,54.5]],{padding:20});

// Traffic Flow laag (ANWB-achtige verkeerskleuren)
map.on("load",()=>{
 try{
   map.addTier(tt.TrafficFlowTilesTier({
      key:API_KEY,
      style:"relative"
   }));
 }catch(e){
   console.log("Traffic Flow laag niet beschikbaar:",e);
 }
});

async function loadIncidents(){
 try{

   const boxes=[
   "3.2,50.7,5.0,52.0",
   "5.0,50.7,7.3,52.0",
   "3.2,52.0,5.0,53.7",
   "5.0,52.0,7.3,53.7"
   ];

   let all=[];
   let totalKm=0;

   for(const bbox of boxes){
      const res=await fetch(
      `https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=nl-NL&key=${API_KEY}`
      );

      const data=await res.json();
      if(data.incidents) all.push(...data.incidents);
   }

   let html="";

   all.slice(0,100).forEach(i=>{
      const p=i.properties||{};
      const road=(p.roadNumbers||[]).join(", ") || "Onbekende weg";
      const km=(p.length||0)/1000;

      totalKm += km;

      html += `
      <div class="card incident">
        <b>${road}</b><br>
        ${p.from||""} → ${p.to||""}<br>
        ${km.toFixed(1)} km
      </div>`;
   });

   document.getElementById("stats").innerHTML =
      `🚨 ${all.length} incidenten<br>📏 ${totalKm.toFixed(1)} km file`;

   document.getElementById("incidentList").innerHTML = html;

 }catch(err){
   console.error(err);
 }
}

loadIncidents();
setInterval(loadIncidents,60000);
</script>

</body>
</html>
