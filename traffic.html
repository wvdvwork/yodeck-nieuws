<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>NL Snelweg Files + Kaart</title>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  display: flex;
  height: 100vh;
}

/* LINKS: lijst */
#sidebar {
  width: 35%;
  overflow: auto;
  border-right: 1px solid #ddd;
  padding: 10px;
}

.item {
  padding: 10px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.item:hover {
  background: #f5f5f5;
}

/* RECHTS: map */
#map {
  flex: 1;
}

.badge {
  background: red;
  color: white;
  padding: 2px 6px;
  font-size: 12px;
  border-radius: 4px;
}
</style>
</head>

<body>

<div id="sidebar">
  <h3>🚧 Snelweg afsluitingen</h3>
  <div id="list">Laden...</div>
</div>

<div id="map"></div>

<script>
const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

// MAP
const map = tt.map({
  key: API_KEY,
  container: "map",
  center: [5.3, 52.1],
  zoom: 7
});

// Nederland in tiles (fix bbox limiet)
const tiles = [
  [3.0, 50.7, 5.0, 51.6],
  [5.0, 50.7, 7.2, 51.6],
  [3.0, 51.6, 5.0, 52.6],
  [5.0, 51.6, 7.2, 52.6],
  [3.0, 52.6, 5.0, 53.6],
  [5.0, 52.6, 7.2, 53.6]
];

// snelweg check
function isHighway(roads) {
  return (roads || []).some(r => r.startsWith("A"));
}

// API call
async function fetchTile(bbox) {
  const url = `https://api.tomtom.com/traffic/services/5/incidentDetails` +
    `?bbox=${bbox.join(",")}` +
    `&fields={incidents{type,geometry{type,coordinates},properties{id,from,to,roadNumbers,events{description}}}}` +
    `&language=nl-NL&key=${API_KEY}`;

  const res = await fetch(url);
  const data = await res.json();
  return data.incidents || [];
}

// alle data ophalen
async function loadData() {
  const results = await Promise.all(tiles.map(fetchTile));

  const mapData = new Map();

  results.flat().forEach(i => {
    if (!mapData.has(i.properties.id)) {
      mapData.set(i.properties.id, i);
    }
  });

  return [...mapData.values()];
}

// markers + lijst
function render(data) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(item => {
    const p = item.properties;

    const isClosed = p.events?.some(e => e.description === "Afgesloten");
    if (!isClosed) return;
    if (!isHighway(p.roadNumbers)) return;

    const coords = item.geometry.coordinates.map(c => [c[0], c[1]]);

    // MAP LINE
    const layerId = p.id;

    map.addLayer({
      id: layerId,
      type: "line",
      source: {
        type: "geojson",
        data: {
          type: "Feature",
          geometry: {
            type: "LineString",
            coordinates: coords
          }
        }
      },
      paint: {
        "line-color": "#ff0000",
        "line-width": 4
      }
    });

    // SIDEBAR ITEM
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <b>${p.from || "Onbekend"} → ${p.to || ""}</b><br>
      <span class="badge">Afgesloten</span><br>
      <small>${(p.roadNumbers || []).join(", ")}</small>
    `;

    div.onclick = () => {
      map.fitBounds(coords, {
        padding: 50
      });
    };

    list.appendChild(div);
  });
}

// RUN
loadData().then(render);
</script>

</body>
</html>
