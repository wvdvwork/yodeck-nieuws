<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Verkeer Nederland LIVE</title>

<link rel="stylesheet"
href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#07122b;
color:white;
height:100vh;
overflow:hidden;
}

/* HEADER */
#header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 28px;
background:rgba(255,255,255,0.05);
}

#title{
font-size:40px;
font-weight:800;
}

#clock{
font-size:24px;
opacity:.8;
}

/* LAYOUT */
#dashboard{
display:flex;
height:calc(100vh - 70px);
}

/* LEFT PANEL */
#left{
width:420px;
padding:18px;
overflow-y:auto;
background:rgba(255,255,255,0.03);
}

#stats{
background:#13224f;
padding:12px;
border-radius:10px;
margin-bottom:12px;
font-weight:bold;
}

/* INCIDENT CARD */
.incident{
background:rgba(255,255,255,0.06);
padding:12px;
border-radius:10px;
margin-bottom:10px;
border-left:5px solid orange;
}

.incident-title{
font-size:15px;
font-weight:bold;
margin-bottom:4px;
}

.incident-road{
font-size:13px;
opacity:.8;
}

/* MAP */
#map{
flex:1;
}

/* SMALL */
.small{
font-size:12px;
opacity:.7;
}

</style>
</head>

<body>

<div id="header">
<div id="title">🚗 Verkeer Nederland</div>
<div id="clock"></div>
</div>

<div id="dashboard">

<div id="left">
<div id="stats">Laden...</div>
<div id="incidentList"></div>
</div>

<div id="map"></div>

</div>

<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>

<script>

const API_KEY = "M7ToFG8ppZQ2JGKPxLHvvsO2w0Yql8cu";

/* CLOCK */
function updateClock(){
const d = new Date();
document.getElementById("clock").innerText =
d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
}
setInterval(updateClock,1000);
updateClock();

/* MAP */
const map = tt.map({
key: API_KEY,
container: "map",
center: [5.3,52.1],
zoom: 7
});

/* disable zoom (optioneel) */
map.scrollZoom.disable();
map.doubleClickZoom.disable();

/* TRAFFIC FLOW LAYER (WERKEND) */
map.on("load", () => {

map.addLayer({
id: "traffic-flow",
type: "raster",
source: {
type: "raster",
tiles: [
"https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key=" + API_KEY
],
tileSize: 256
}
});

});

/* MARKERS */
let markers = [];

/* INCIDENT LOAD (FIXED BBOX SPLIT) */
async function loadIncidents(){

try{

markers.forEach(m => m.remove());
markers = [];

let all = [];

const boxes = [
"3.2,50.7,5.0,52.0",
"5.0,50.7,7.3,52.0",
"3.2,52.0,5.0,53.7",
"5.0,52.0,7.3,53.7"
];

for(const bbox of boxes){

const url =
`https://api.tomtom.com/traffic/services/5/incidentDetails?bbox=${bbox}&language=nl-NL&key=${API_KEY}`;

const res = await fetch(url);
const data = await res.json();

if(data.incidents){
all.push(...data.incidents);
}

}

document.getElementById("stats").innerText =
`🚨 ${all.length} incidenten actief`;

let html = "";

all.forEach(i => {

const p = i.properties || {};
const type = p.iconCategory || 0;

let title = "Verkeersmelding";

if(type === 1) title = "Ongeval";
if(type === 6) title = "File";
if(type === 8) title = "Afsluiting";
if(type === 9) title = "Werkzaamheden";

html += `
<div class="incident">
<div class="incident-title">${title}</div>
<div class="incident-road">
${(p.roadNumbers || []).join(", ") || "Onbekende weg"}
</div>
<div class="small">
${p.from || ""} → ${p.to || ""}
</div>
</div>
`;

if(i.geometry && i.geometry.coordinates){

let coords;

if(i.geometry.type === "LineString"){
coords = i.geometry.coordinates[0];
}else{
coords = i.geometry.coordinates;
}

if(coords && coords.length === 2){

const el = document.createElement("div");
el.style.width = "10px";
el.style.height = "10px";
el.style.borderRadius = "50%";
el.style.background = "red";
el.style.border = "2px solid white";

new tt.Marker({element: el})
.setLngLat(coords)
.addTo(map);

markers.push(el);
}

}

});

document.getElementById("incidentList").innerHTML = html;

}catch(err){
console.error(err);
document.getElementById("stats").innerText =
"Fout bij laden data";
}

}

/* INIT */
loadIncidents();
setInterval(loadIncidents, 60000);

</script>

</body>
</html>
